<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #17312d;
        --muted: #647570;
        --paper: #f3f6f4;
        --surface: #ffffff;
        --line: #d9e2dc;
        --green: #14745f;
        --green-soft: #e4f1eb;
        --coral: #bd533e;
        --gold: #efc35b;
        --shadow: 0 12px 32px rgba(22, 48, 43, .08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Aptos", "Segoe UI", sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px clamp(18px, 4vw, 56px); background: var(--ink); color: white; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; }
      .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink); background: var(--gold); font: 700 16px Georgia, serif; }
      .account { color: #d6e4dd; text-align: right; font-size: 13px; }
      .shell { max-width: 1440px; margin: 0 auto; padding: 26px clamp(16px, 4vw, 56px) 56px; }
      .nav { display: flex; align-items: center; gap: 8px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
      .nav button, .subnav button { border: 0; border-radius: 4px; padding: 9px 14px; color: var(--muted); background: transparent; }
      .nav button[aria-current="page"], .subnav button[aria-current="page"] { color: var(--green); background: var(--green-soft); font-weight: 700; }
      main { padding-top: 30px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font: 500 42px/1.1 Georgia, "Times New Roman", serif; letter-spacing: 0; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { font-size: 17px; margin-bottom: 4px; }
      .eyebrow { color: var(--coral); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      .lede, .muted { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
      .list { display: grid; gap: 10px; max-width: 860px; }
      .list-row, .resource-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 17px 20px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .list-row button { color: inherit; text-align: left; border: 0; background: none; padding: 0; }
      .list-row strong { display: block; font-size: 16px; }
      .list-row small { color: var(--muted); }
      .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
      .resource { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
      .resource p { white-space: pre-wrap; color: var(--muted); }
      .resource a { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
      .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 22px; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
      .toolbar select, .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid #b9c8c0; border-radius: 3px; }
      .toolbar select { width: auto; min-width: 190px; }
      .button { min-height: 40px; padding: 9px 14px; border: 1px solid var(--green); border-radius: 3px; color: white; background: var(--green); font-weight: 700; }
      .button.secondary { color: var(--green); background: white; }
      .button.danger { border-color: var(--coral); color: white; background: var(--coral); }
      .button:disabled { opacity: .55; cursor: wait; }
      .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { max-width: 300px; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      th { position: sticky; top: 0; color: var(--muted); background: #edf2ef; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .actions { display: flex; gap: 8px; white-space: nowrap; }
      .link-button { border: 0; padding: 4px; color: var(--green); background: transparent; font-weight: 700; }
      .link-button:disabled { color: #84918c; cursor: not-allowed; }
      .editor { margin-top: 22px; padding: 22px; background: #e9efeb; border-top: 3px solid var(--green); }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .field { min-width: 0; display: grid; gap: 5px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
      .field.wide { grid-column: 1 / -1; }
      .field textarea { min-height: 100px; resize: vertical; }
      .field.check { align-content: start; }
      .field.check input { width: 18px; height: 18px; accent-color: var(--green); }
      .notice { margin: 14px 0; padding: 12px 14px; border-left: 3px solid var(--gold); background: #fff7de; color: #604c16; }
      .error { border-left-color: var(--coral); background: #fff0ec; color: #7c2b1b; }
      .empty { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed #b9c8c0; }
      .status { min-height: 24px; color: var(--coral); }
      .back { margin-bottom: 22px; }
      .student-greeting { padding: clamp(24px, 5vw, 56px); background: var(--surface); border-top: 4px solid var(--gold); box-shadow: var(--shadow); }
      .student-greeting h1 { max-width: 840px; }
      .pathway { display: grid; gap: 18px; max-width: 980px; margin-top: 34px; }
      .pathway-phase { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .pathway-phase.locked { border-top-color: #aab7b0; }
      .phase-heading { display: flex; justify-content: space-between; gap: 18px; padding: 20px 22px 14px; }
      .phase-heading h2 { margin-bottom: 4px; font: 500 25px/1.2 Georgia, "Times New Roman", serif; }
      .phase-status { flex: none; align-self: start; padding: 4px 9px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 700; }
      .locked .phase-status { color: var(--muted); background: #edf0ee; }
      .phase-description { margin: 0 22px 14px; color: var(--muted); }
      .milestone-list { margin: 0; padding: 0; list-style: none; }
      .milestone-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: start; gap: 12px; padding: 15px 22px; border-top: 1px solid var(--line); }
      .milestone-item input { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .milestone-item h3 { margin: 0 0 4px; }
      .milestone-item p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .milestone-meta { color: var(--muted); font-size: 12px; text-align: right; }
      .milestone-type { color: var(--coral); font-size: 11px; font-weight: 750; text-transform: uppercase; }
      .section-gap { margin-top: 38px; }
      @media (max-width: 700px) {
        .topbar { align-items: flex-start; padding: 14px 16px; }
        .shell { padding: 16px 14px 36px; }
        .nav { overflow-x: auto; }
        .nav button { white-space: nowrap; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .form-grid { grid-template-columns: 1fr; }
        .field.wide { grid-column: auto; }
        .list-row { align-items: flex-start; }
        .account { max-width: 48%; overflow-wrap: anywhere; }
        h1 { font-size: 34px; }
        .phase-heading { padding: 16px; }
        .phase-description { margin-inline: 16px; }
        .milestone-item { padding: 13px 16px; grid-template-columns: 24px minmax(0, 1fr); }
        .milestone-meta { grid-column: 2; text-align: left; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="shell"><p class="muted">Connecting to VSA EE Hub...</p></div></div>
    <script>
      const state = {
        user: null,
        view: 'home',
        cohortId: '',
        selectedStudent: null,
        adminEntity: 'cohorts',
        adminData: null,
        editingRecord: null,
        originalKey: '',
        status: '',
        selectedMemberIds: [],
        importRecords: null
      };

      document.addEventListener('DOMContentLoaded', start);

      function start() {
        callServer('getAppBootstrap').then(function(result) {
          if (!result || !result.user) {
            showFatal('Access unavailable', 'Your signed-in account is not registered in the EE workbook.');
            return;
          }
          state.user = result.user;
          state.view = state.user.role === 'student' ? 'student' : 'staff';
          renderShell();
        }).catch(function(error) {
          showFatal('Unable to start', error.message || 'The application could not reach the EE workbook.');
        });
      }

      function callServer(method) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function(resolve, reject) {
          if (!window.google || !google.script || !google.script.run) {
            reject(new Error('Open this app from its Google Apps Script deployment.'));
            return;
          }
          const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error) {
            reject(new Error(error && error.message ? error.message : String(error)));
          });
          runner[method].apply(runner, args);
        });
      }

      function renderShell() {
        const tabs = state.user.role === 'student'
          ? [['student', 'My EE'], ['resources', 'Resources']]
          : [['staff', 'Cohorts'], ['resources', 'Resources']];
        if (state.user.permissions && state.user.permissions.canAdmin) tabs.push(['admin', 'Admin']);
        document.getElementById('app').innerHTML = `
          <header class="topbar">
            <div class="brand"><span class="brand-mark">EE</span><span>VSA EE HUB</span></div>
            <div class="account">${escapeHtml(state.user.displayName)}<br>${escapeHtml(state.user.email)}</div>
          </header>
          <div class="shell">
            <nav class="nav" aria-label="Main navigation">${tabs.map(function(tab) {
              return `<button type="button" data-view="${tab[0]}" aria-current="${state.view === tab[0] ? 'page' : 'false'}">${tab[1]}</button>`;
            }).join('')}</nav>
            <main id="main" aria-live="polite"></main>
          </div>`;
        document.querySelectorAll('[data-view]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.view = button.dataset.view;
            state.selectedStudent = null;
            state.status = '';
            renderShell();
          });
        });
        if (state.view === 'student') renderStudentView();
        else if (state.view === 'staff') renderStaffView();
        else if (state.view === 'resources') renderResources();
        else renderAdmin();
      }

      function renderStudentView() {
        const main = document.getElementById('main');
        main.innerHTML = '<p class="muted">Loading student view...</p>';
        const email = state.selectedStudent ? state.selectedStudent.email : '';
        const cohort = state.selectedStudent ? state.selectedStudent.cohortId : '';
        callServer('getStudentView', email, cohort).then(function(student) {
          main.innerHTML = `${state.selectedStudent ? '<button type="button" class="link-button back" id="back-to-roster">← Back to cohort</button>' : ''}
            <section class="student-greeting"><p class="eyebrow">Extended Essay</p><h1>Hello, ${escapeHtml(student.displayName)}</h1></section>
            ${renderPathway(student.pathway || [], student, email, cohort)}`;
          const back = document.getElementById('back-to-roster');
          if (back) back.addEventListener('click', function() { state.selectedStudent = null; renderStaffView(); });
          main.querySelectorAll('[data-milestone-complete]').forEach(function(input) {
            input.addEventListener('change', function() {
              const requestedState = input.checked;
              input.disabled = true;
              callServer('setMilestoneCompletion', email, input.dataset.milestoneComplete, requestedState, cohort).then(renderStudentView).catch(function(error) {
                input.checked = !requestedState;
                input.disabled = false;
                showError(error);
              });
            });
          });
        }).catch(showError);
      }

      function renderPathway(phases, student, email, cohort) {
        if (!phases.length) return '<section class="pathway"><div class="empty">Milestones and phases have not been configured yet.</div></section>';
        return `<section class="pathway" aria-label="Milestone pathway">${phases.map(function(phase) {
          const milestones = phase.milestones || [];
          return `<article class="pathway-phase ${phase.unlocked ? '' : 'locked'}">
            <header class="phase-heading"><div><p class="eyebrow">${escapeHtml(phase.phaseId)}</p><h2>${escapeHtml(phase.title)}</h2></div><span class="phase-status">${phase.unlocked ? 'Available' : 'Locked'}</span></header>
            ${phase.description ? `<p class="phase-description">${escapeHtml(phase.description)}</p>` : ''}
            ${!phase.unlocked && phase.prerequisitePhaseId ? `<p class="phase-description">Complete all milestones in ${escapeHtml(phase.prerequisitePhaseId)} to unlock this phase.</p>` : ''}
            ${milestones.length ? `<ul class="milestone-list">${milestones.map(function(milestone) {
              return `<li class="milestone-item"><input type="checkbox" data-milestone-complete="${escapeHtml(milestone.milestoneId)}" aria-label="Mark ${escapeHtml(milestone.title)} complete" ${milestone.completed ? 'checked' : ''} ${milestone.canComplete ? '' : 'disabled'}><div><h3>${escapeHtml(milestone.title)}</h3><p>${escapeHtml(milestone.description)}</p></div><div class="milestone-meta"><span class="milestone-type">${escapeHtml(milestone.type)}</span><br>${escapeHtml(milestone.owner)}${milestone.offsetDays !== '' ? ' · offset ' + escapeHtml(milestone.offsetDays) + 'd' : ''}</div></li>`;
            }).join('')}</ul>` : '<p class="phase-description">No milestones in this phase.</p>'}
          </article>`;
        }).join('')}</section>`;
      }

      function renderStaffView() {
        const main = document.getElementById('main');
        if (state.selectedStudent) {
          renderStudentView();
          return;
        }
        if (state.cohortId) {
          main.innerHTML = `<button type="button" class="link-button back" id="back-to-cohorts">← All cohorts</button>
            <div class="page-head"><div><p class="eyebrow">Staff workspace</p><h1>Cohort ${escapeHtml(state.cohortId)}</h1><p class="lede">Select a student to open their view.</p></div></div>
            <div id="staff-list" class="list"><p class="muted">Loading students...</p></div>`;
          document.getElementById('back-to-cohorts').addEventListener('click', function() { state.cohortId = ''; renderStaffView(); });
          callServer('getCohortStudents', state.cohortId).then(function(students) {
            const list = document.getElementById('staff-list');
            if (!students.length) { list.innerHTML = '<div class="empty">No student records are listed in this cohort.</div>'; return; }
            list.innerHTML = students.map(function(student, index) {
              return `<div class="list-row"><button type="button" data-student-index="${index}"><strong>${escapeHtml(student.displayName)}</strong><small>${escapeHtml(student.email)}${student.studentId ? ' · ' + escapeHtml(student.studentId) : ''}</small></button>${student.hasStudentIdConflict ? '<span class="notice">Student ID columns differ</span>' : ''}</div>`;
            }).join('');
            list.querySelectorAll('[data-student-index]').forEach(function(button) {
              button.addEventListener('click', function() {
                const student = students[Number(button.dataset.studentIndex)];
                state.selectedStudent = { email: student.email, cohortId: state.cohortId };
                renderStaffView();
              });
            });
          }).catch(showError);
          return;
        }

        main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Staff workspace</p><h1>Cohorts</h1><p class="lede">Choose a cohort to view its student list.</p></div></div><div id="staff-list" class="list"><p class="muted">Loading cohorts...</p></div>`;
        callServer('getCohorts').then(function(cohorts) {
          const list = document.getElementById('staff-list');
          if (!cohorts.length) { list.innerHTML = '<div class="empty">No active cohort sheets were found.</div>'; return; }
          list.innerHTML = cohorts.map(function(cohort, index) {
            return `<div class="list-row"><button type="button" data-cohort-index="${index}"><strong>${escapeHtml(cohort.name)}</strong><small>${escapeHtml(cohort.sheetName)}</small></button><span aria-hidden="true">›</span></div>`;
          }).join('');
          list.querySelectorAll('[data-cohort-index]').forEach(function(button) {
            button.addEventListener('click', function() {
              state.cohortId = cohorts[Number(button.dataset.cohortIndex)].id;
              renderStaffView();
            });
          });
        }).catch(showError);
      }

      function renderResources() {
        const main = document.getElementById('main');
        main.innerHTML = '<p class="muted">Loading resources...</p>';
        callServer('getContentHub').then(function(content) {
          const pages = content.pages || [];
          const resources = content.resources || [];
          main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Extended Essay</p><h1>Resources</h1><p class="lede">Guidance and reference material for your EE.</p></div></div>
            ${pages.length ? `<section><h2>Guides</h2><div class="resource-grid">${pages.map(renderPage).join('')}</div></section>` : ''}
            <section class="${pages.length ? 'section-gap' : ''}"><h2>Reference library</h2>${resources.length ? `<div class="resource-grid">${resources.map(renderResource).join('')}</div>` : '<div class="empty">Resources will appear here when published.</div>'}</section>`;
        }).catch(showError);
      }

      function renderPage(page) {
        return `<article class="resource"><p class="eyebrow">${escapeHtml(page.Audience || 'All')}</p><h3>${escapeHtml(page.Title)}</h3><p>${escapeHtml(page.Body || '')}</p></article>`;
      }

      function renderResource(resource) {
        const url = safeUrl(resource.URL);
        return `<article class="resource"><p class="eyebrow">${escapeHtml(resource.Category || 'Resource')}</p><h3>${escapeHtml(resource.Title)}</h3><p>${escapeHtml(resource.Description || '')}</p>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open resource ↗</a>` : ''}</article>`;
      }

      const adminSections = [
        ['cohorts', 'Cohorts'], ['cohortMembers', 'Students in cohorts'], ['phases', 'Phases'], ['milestones', 'Milestones'],
        ['studentUsers', 'Student users'], ['staffUsers', 'Staff users'], ['subjects', 'Subjects'],
        ['pages', 'Website pages'], ['resources', 'Resources']
      ];

      function renderAdmin() {
        const main = document.getElementById('main');
        main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Administration</p><h1>Admin</h1><p class="lede">Manage the records that power the EE Hub.</p></div></div>
          <nav class="subnav" aria-label="Admin sections">${adminSections.map(function(section) {
            return `<button type="button" data-admin-entity="${section[0]}" aria-current="${state.adminEntity === section[0] ? 'page' : 'false'}">${section[1]}</button>`;
          }).join('')}</nav><div id="admin-content"><p class="muted">Loading...</p></div>`;
        main.querySelectorAll('[data-admin-entity]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.adminEntity = button.dataset.adminEntity;
            state.editingRecord = null;
            state.status = '';
            renderAdmin();
          });
        });
        loadAdminSection();
      }

      function loadAdminSection() {
        const target = document.getElementById('admin-content');
        if (!target) return;
        if (state.adminEntity === 'cohortMembers') {
          callServer('getCohorts').then(function(cohorts) {
            const current = cohorts.some(function(cohort) { return cohort.id === state.cohortId; }) ? state.cohortId : (cohorts[0] ? cohorts[0].id : '');
            state.cohortId = current;
            if (!current) {
              target.innerHTML = '<div class="empty">Create an active cohort before adding students.</div>';
              return;
            }
            target.innerHTML = `<div class="toolbar"><label for="admin-cohort">Cohort</label><select id="admin-cohort">${cohorts.map(function(cohort) {
              return `<option value="${escapeHtml(cohort.id)}" ${cohort.id === current ? 'selected' : ''}>${escapeHtml(cohort.name)}</option>`;
            }).join('')}</select></div><div id="admin-records"><p class="muted">Loading students...</p></div>`;
            document.getElementById('admin-cohort').addEventListener('change', function(event) {
              state.cohortId = event.target.value;
              state.editingRecord = null;
              state.selectedMemberIds = [];
              state.importRecords = null;
              loadAdminSection();
            });
            callServer('getCohortMembersForAdmin', current).then(renderAdminData).catch(showError);
          }).catch(showError);
          return;
        }
        callServer('getAdminRecords', state.adminEntity).then(renderAdminData).catch(showError);
      }

      function renderAdminData(data) {
        state.adminData = data;
        const target = document.getElementById('admin-records') || document.getElementById('admin-content');
        if (!target) return;
        const entity = state.adminEntity;
        const schemaFields = data.schema && data.schema.fields ? data.schema.fields : (data.headers || []).map(function(name) { return { name: name }; });
        const records = data.records || [];
        const columns = schemaFields.filter(function(field) { return field.table !== false; });
        if (entity === 'cohortMembers') state.selectedMemberIds = [];
        const isCohortMembers = entity === 'cohortMembers';
        target.innerHTML = `<div class="toolbar"><button type="button" class="button" id="new-record">Add ${escapeHtml(sectionLabel(entity).replace(/s$/, ''))}</button>${isCohortMembers ? '<button type="button" class="button secondary" id="open-roster-import">Import CSV / paste</button><button type="button" class="button secondary" id="create-selected-users" disabled>Add selected as users</button><label><input type="checkbox" id="select-all-members"> Select all</label><span id="selected-count" class="muted">0 selected</span>' : ''}<span class="muted">${records.length} record${records.length === 1 ? '' : 's'}</span></div>
          ${state.status ? `<p class="status">${escapeHtml(state.status)}</p>` : ''}
          ${records.length ? `<div class="table-wrap"><table><thead><tr>${isCohortMembers ? '<th><span class="sr-only">Select</span></th>' : ''}${columns.map(function(field) { return `<th>${escapeHtml(field.label || field.name)}</th>`; }).join('')}<th>Actions</th></tr></thead><tbody>${records.map(function(record, index) {
            return `<tr>${isCohortMembers ? `<td><input type="checkbox" data-select-member value="${escapeHtml(record.StudentId)}" ${record.hasStudentIdConflict ? 'disabled title="Resolve Student ID conflicts first"' : ''}></td>` : ''}${columns.map(function(field) { return `<td>${escapeHtml(formatValue(record[field.name]))}</td>`; }).join('')}<td><div class="actions"><button type="button" class="link-button" data-edit="${index}" ${record.hasStudentIdConflict ? 'disabled title="Reconcile duplicate Student ID values first"' : ''}>Edit</button><button type="button" class="link-button" data-delete="${index}">Delete</button></div>${record.hasStudentIdConflict ? '<div class="notice">Duplicate Student ID values disagree.</div>' : ''}</td></tr>`;
          }).join('')}</tbody></table></div>` : '<div class="empty">No records yet.</div>'}
          <div id="roster-import-panel"></div><div id="record-editor"></div>`;
        document.getElementById('new-record').addEventListener('click', function() { openEditor(null); });
        if (isCohortMembers) {
          document.getElementById('open-roster-import').addEventListener('click', openRosterImport);
          document.getElementById('create-selected-users').addEventListener('click', createSelectedUsers);
          document.getElementById('select-all-members').addEventListener('change', function(event) {
            state.selectedMemberIds = event.target.checked ? records.filter(function(record) { return !record.hasStudentIdConflict; }).map(function(record) { return record.StudentId; }) : [];
            target.querySelectorAll('[data-select-member]').forEach(function(input) { input.checked = state.selectedMemberIds.indexOf(input.value) >= 0; });
            updateSelectedCount();
          });
          target.querySelectorAll('[data-select-member]').forEach(function(input) {
            input.addEventListener('change', function() {
              state.selectedMemberIds = Array.from(target.querySelectorAll('[data-select-member]:checked')).map(function(item) { return item.value; });
              updateSelectedCount();
            });
          });
        }
        target.querySelectorAll('[data-edit]').forEach(function(button) {
          button.addEventListener('click', function() { openEditor(records[Number(button.dataset.edit)]); });
        });
        target.querySelectorAll('[data-delete]').forEach(function(button) {
          button.addEventListener('click', function() { removeRecord(records[Number(button.dataset.delete)]); });
        });
        if (state.editingRecord) openEditor(state.editingRecord.record, true);
      }

      function updateSelectedCount() {
        const count = document.getElementById('selected-count');
        const action = document.getElementById('create-selected-users');
        const selectAll = document.getElementById('select-all-members');
        const selectable = Array.from(document.querySelectorAll('[data-select-member]:not(:disabled)'));
        if (count) count.textContent = state.selectedMemberIds.length + ' selected';
        if (action) action.disabled = state.selectedMemberIds.length === 0;
        if (selectAll) selectAll.checked = selectable.length > 0 && selectable.every(function(input) { return input.checked; });
      }

      function openRosterImport() {
        const panel = document.getElementById('roster-import-panel');
        state.importRecords = null;
        const requiredHeaders = (state.adminData.schema.fields || []).filter(function(field) { return field.required; }).map(function(field) { return field.name; });
        panel.innerHTML = `<section class="editor"><h2>Import cohort students</h2>
          <div class="toolbar"><label class="button secondary" for="roster-file">Choose CSV</label><input id="roster-file" type="file" accept=".csv,text/csv" hidden></div>
          <div class="field"><label for="roster-source">Roster data</label><textarea id="roster-source" placeholder="${escapeHtml(requiredHeaders.join(', '))}"></textarea></div>
          <div class="toolbar"><button type="button" class="button secondary" id="preview-roster">Preview</button><button type="button" class="button secondary" id="cancel-roster-import">Cancel</button></div>
          <div id="roster-preview"></div></section>`;
        const source = document.getElementById('roster-source');
        document.getElementById('roster-file').addEventListener('change', function(event) {
          const file = event.target.files[0];
          if (file) file.text().then(function(text) { source.value = text; state.importRecords = null; });
        });
        document.getElementById('preview-roster').addEventListener('click', previewRosterImport);
        document.getElementById('cancel-roster-import').addEventListener('click', function() {
          panel.innerHTML = '';
          state.importRecords = null;
        });
      }

      function parseRosterText(sourceText, requiredHeaders) {
        const firstLine = String(sourceText).split(/\r?\n/, 1)[0] || '';
        const delimiter = firstLine.indexOf('\t') >= 0 ? '\t' : ',';
        const rows = [];
        let row = [];
        let field = '';
        let quoted = false;
        const source = String(sourceText).replace(/^\uFEFF/, '');
        for (let index = 0; index < source.length; index++) {
          const character = source[index];
          if (character === '"') {
            if (quoted && source[index + 1] === '"') { field += '"'; index++; }
            else quoted = !quoted;
          } else if (!quoted && character === delimiter) {
            row.push(field);
            field = '';
          } else if (!quoted && (character === '\n' || character === '\r')) {
            if (character === '\r' && source[index + 1] === '\n') index++;
            row.push(field);
            if (row.some(function(value) { return value.trim() !== ''; })) rows.push(row);
            row = [];
            field = '';
          } else {
            field += character;
          }
        }
        if (quoted) throw new Error('A quoted field is not closed.');
        row.push(field);
        if (row.some(function(value) { return value.trim() !== ''; })) rows.push(row);
        if (rows.length < 2) throw new Error('Include a header row and at least one student.');

        const headers = rows.shift().map(function(value) { return value.trim(); });
        if (headers.some(function(header) { return !header; })) throw new Error('Every column needs a header.');
        if (new Set(headers).size !== headers.length) throw new Error('Duplicate column headers are ambiguous.');
        (requiredHeaders || []).forEach(function(header) {
          if (headers.indexOf(header) < 0) throw new Error('Missing required column: ' + header);
        });
        return rows.map(function(values, index) {
          if (values.length > headers.length) throw new Error('Row ' + (index + 2) + ' has more values than headers.');
          const record = {};
          headers.forEach(function(header, column) { record[header] = (values[column] || '').trim(); });
          return record;
        });
      }

      function previewRosterImport() {
        const preview = document.getElementById('roster-preview');
        try {
          const requiredHeaders = (state.adminData.schema.fields || []).filter(function(field) { return field.required; }).map(function(field) { return field.name; });
          state.importRecords = parseRosterText(document.getElementById('roster-source').value, requiredHeaders);
          const sample = state.importRecords.slice(0, 8);
          const previewFields = (state.adminData.schema.fields || []).filter(function(field) { return field.required; }).slice(0, 3);
          preview.innerHTML = `<p class="muted">${state.importRecords.length} rows ready to import to cohort ${escapeHtml(state.cohortId)}.</p>
            <div class="table-wrap"><table><thead><tr>${previewFields.map(function(field) { return `<th>${escapeHtml(field.label || field.name)}</th>`; }).join('')}</tr></thead><tbody>${sample.map(function(record) {
              return `<tr>${previewFields.map(function(field) { return `<td>${escapeHtml(record[field.name])}</td>`; }).join('')}</tr>`;
            }).join('')}</tbody></table></div>
            <div class="toolbar"><button type="button" class="button" id="confirm-roster-import">Import ${state.importRecords.length} students</button></div>`;
          document.getElementById('confirm-roster-import').addEventListener('click', confirmRosterImport);
        } catch (error) {
          state.importRecords = null;
          preview.innerHTML = `<p class="notice error">${escapeHtml(error.message)}</p>`;
        }
      }

      function confirmRosterImport(event) {
        const button = event.currentTarget;
        button.disabled = true;
        callServer('importCohortMembers', state.cohortId, state.importRecords).then(function(result) {
          state.status = 'Imported ' + result.imported + ' students.';
          state.importRecords = null;
          document.getElementById('roster-import-panel').innerHTML = '';
          loadAdminSection();
        }).catch(function(error) {
          button.disabled = false;
          showError(error);
        });
      }

      function createSelectedUsers() {
        const button = document.getElementById('create-selected-users');
        if (!state.selectedMemberIds.length || !window.confirm('Add the selected students as user accounts? Existing accounts will be skipped.')) return;
        button.disabled = true;
        callServer('createStudentUsersFromCohort', state.cohortId, state.selectedMemberIds).then(function(result) {
          state.status = result.created + ' user accounts added; ' + result.alreadyExists + ' already existed.';
          state.selectedMemberIds = [];
          loadAdminSection();
        }).catch(function(error) {
          button.disabled = false;
          showError(error);
        });
      }

      function openEditor(record, preserve, phaseOptionsLoaded) {
        const data = state.adminData || { headers: [] };
        const entity = state.adminEntity;
        const fields = data.schema && data.schema.fields ? data.schema.fields : (data.headers || []).map(function(name) { return { name: name }; });
        state.editingRecord = record ? { record: record } : (preserve ? state.editingRecord : null);
        const editing = !!record || !!(preserve && state.originalKey);
        state.originalKey = editing ? keyValue(entity, record || state.editingRecord.record) : '';
        const editor = document.getElementById('record-editor');
        editor.innerHTML = `<section class="editor"><h2>${editing ? 'Edit record' : 'Add record'}</h2>
          ${entity === 'studentUsers' && !editing ? '<div id="cohort-import"></div>' : ''}
          <form id="record-form"><div class="form-grid">${fields.map(function(field) { return fieldMarkup(field, record ? record[field.name] : '', editing); }).join('')}</div>
            <div class="toolbar"><button class="button" type="submit">Save</button><button class="button secondary" type="button" id="cancel-edit">Cancel</button></div></form></section>`;
        const form = document.getElementById('record-form');
        form.addEventListener('submit', saveForm);
        document.getElementById('cancel-edit').addEventListener('click', function() {
          state.editingRecord = null;
          state.originalKey = '';
          document.getElementById('record-editor').innerHTML = '';
        });
        if (entity === 'studentUsers' && !editing) renderCohortImport();
      }

      function fieldMarkup(field, value, editing) {
        const name = field.name;
        const required = field.required ? 'required' : '';
        const disabled = (editing && field.key) || field.editable === false ? 'disabled' : '';
        const label = field.label || name;
        const wide = field.type === 'textarea' ? 'wide' : '';
        const currentValue = value === undefined || value === null ? (field.defaultValue === undefined ? '' : field.defaultValue) : value;
        if (field.type === 'checkbox') {
          const checked = toBoolean(currentValue);
          return `<div class="field check"><label><input type="checkbox" data-field="${escapeHtml(name)}" ${checked ? 'checked' : ''} ${disabled}> ${escapeHtml(label)}</label></div>`;
        }
        if (field.type === 'select') {
          const options = field.options || [];
          const blankOption = field.allowBlank ? `<option value="">No prerequisite</option>` : `<option value="">Choose ${escapeHtml(label)}</option>`;
          return `<div class="field"><label>${escapeHtml(label)}${required ? ' *' : ''}</label><select data-field="${escapeHtml(name)}" ${required} ${disabled}>${blankOption}${options.map(function(option) {
            const item = typeof option === 'string' ? { value: option, label: option } : option;
            return `<option value="${escapeHtml(item.value)}" ${String(currentValue) === String(item.value) ? 'selected' : ''}>${escapeHtml(item.label)}</option>`;
          }).join('')}</select></div>`;
        }
        const inputType = ['text', 'email', 'url', 'number', 'date'].indexOf(field.type) >= 0 ? field.type : 'text';
        const formatted = escapeHtml(formatValue(currentValue));
        const control = field.type === 'textarea'
          ? `<textarea data-field="${escapeHtml(name)}" ${required} ${disabled}>${formatted}</textarea>`
          : `<input type="${inputType}" data-field="${escapeHtml(name)}" value="${formatted}" ${required} ${disabled}>`;
        return `<div class="field ${wide}"><label>${escapeHtml(label)}${required ? ' *' : ''}</label>${control}</div>`;
      }

      function renderCohortImport() {
        const target = document.getElementById('cohort-import');
        target.innerHTML = '<div class="toolbar"><button type="button" class="button secondary" id="show-cohort-import">Fill from cohort roster</button></div>';
        document.getElementById('show-cohort-import').addEventListener('click', function() {
          callServer('getCohorts').then(function(cohorts) {
            if (!cohorts.length) { target.innerHTML = '<p class="notice">No cohorts are available.</p>'; return; }
            target.innerHTML = `<div class="toolbar"><label for="import-cohort">Cohort</label><select id="import-cohort">${cohorts.map(function(cohort) {
              return `<option value="${escapeHtml(cohort.id)}">${escapeHtml(cohort.name)}</option>`;
            }).join('')}<option value=""></option></select><label for="import-student">Student</label><select id="import-student"><option value="">Choose a student</option></select></div>`;
            const cohortSelect = document.getElementById('import-cohort');
            const studentSelect = document.getElementById('import-student');
            function loadMembers() {
              if (!cohortSelect.value) return;
              callServer('getCohortMembersForAdmin', cohortSelect.value).then(function(result) {
                studentSelect.innerHTML = '<option value="">Choose a student</option>' + (result.records || []).map(function(member, index) {
                  return `<option value="${index}" ${member.hasStudentIdConflict ? 'disabled' : ''}>${escapeHtml(member['Display Name'] || member.StudentId)} · ${escapeHtml(member.StudentId)}${member.hasStudentIdConflict ? ' · ID conflict' : ''}</option>`;
                }).join('');
                studentSelect.onchange = function() {
                  const member = result.records[Number(studentSelect.value)];
                  if (!member) return;
                  setField('DisplayName', member['Display Name']);
                  setField('Cohort', cohortSelect.value);
                  setField('StudentId', member.StudentId);
                  setField('studentEmail', member['Student Email']);
                  setField('parentEmail', member['Family Email']);
                };
              }).catch(showError);
            }
            cohortSelect.addEventListener('change', loadMembers);
            loadMembers();
          }).catch(showError);
        });
      }

      function setField(name, value) {
        const input = document.querySelector(`[data-field="${cssEscape(name)}"]`);
        if (input && !input.disabled) input.value = value || '';
      }

      function saveForm(event) {
        event.preventDefault();
        const entity = state.adminEntity;
        const form = event.currentTarget;
        const record = {};
        form.querySelectorAll('[data-field]').forEach(function(input) {
          if (input.type === 'checkbox') record[input.dataset.field] = input.checked;
          else record[input.dataset.field] = input.value;
        });
        const submit = form.querySelector('[type="submit"]');
        submit.disabled = true;
        const request = entity === 'cohortMembers'
          ? callServer('saveCohortMember', state.cohortId, record, state.originalKey || '')
          : callServer('saveAdminRecord', entity, record, state.originalKey || '');
        request.then(function(result) {
          state.status = result && result.auditWarning ? 'Saved, but the completion audit entry could not be written. Check AUDIT_LOGS.' : 'Saved.';
          state.editingRecord = null;
          state.originalKey = '';
          loadAdminSection();
        }).catch(function(error) {
          submit.disabled = false;
          showError(error);
        });
      }

      function removeRecord(record) {
        const entity = state.adminEntity;
        const key = keyValue(entity, record);
        const noun = entity === 'cohorts' ? 'archive this cohort' : 'delete this record';
        if (!window.confirm(`Are you sure you want to ${noun}?`)) return;
        const request = entity === 'cohortMembers'
          ? callServer('deleteCohortMember', state.cohortId, key)
          : callServer('deleteAdminRecord', entity, key);
        request.then(function(result) {
          state.status = result && result.auditWarning ? 'Change saved, but the completion audit entry could not be written.' : 'Change saved.';
          state.editingRecord = null;
          loadAdminSection();
        }).catch(showError);
      }

      function keyValue(entity, record) {
        if (!record || !state.adminData || !state.adminData.schema) return '';
        var key = state.adminData.schema.fields.filter(function(field) { return field.key; })[0];
        return key ? record[key.name] || '' : '';
      }

      function sectionLabel(entity) {
        const item = adminSections.filter(function(section) { return section[0] === entity; })[0];
        return item ? item[1] : entity;
      }

      function formatValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return String(value);
      }

      function toBoolean(value) {
        return value === true || value === 1 || ['true', '1', 'yes'].indexOf(String(value || '').toLowerCase()) >= 0;
      }

      function safeUrl(value) {
        try {
          const parsed = new URL(String(value || ''));
          return parsed.protocol === 'https:' ? parsed.href : '';
        } catch (error) { return ''; }
      }

      function cssEscape(value) {
        return String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      }

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function showError(error) {
        const message = error && error.message ? error.message : String(error);
        const main = document.getElementById('main');
        const admin = document.getElementById('admin-content');
        const target = admin || main;
        if (target) target.innerHTML = `<p class="notice error">${escapeHtml(message)}</p>`;
      }

      function showFatal(title, message) {
        document.getElementById('app').innerHTML = `<div class="shell"><p class="eyebrow">VSA EE Hub</p><h1>${escapeHtml(title)}</h1><p class="notice error">${escapeHtml(message)}</p></div>`;
      }
    </script>
  </body>
</html>
