<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #17312d;
        --muted: #647570;
        --paper: #f3f6f4;
        --surface: #ffffff;
        --line: #d9e2dc;
        --green: #14745f;
        --green-soft: #e4f1eb;
        --coral: #bd533e;
        --gold: #efc35b;
        --shadow: 0 12px 32px rgba(22, 48, 43, .08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Aptos", "Segoe UI", sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px clamp(18px, 4vw, 56px); background: var(--ink); color: white; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; }
      .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink); background: var(--gold); font: 700 16px Georgia, serif; }
      .account { color: #d6e4dd; text-align: right; font-size: 13px; }
      .shell { max-width: 1440px; margin: 0 auto; padding: 26px clamp(16px, 4vw, 56px) 56px; }
      .nav { display: flex; align-items: center; gap: 8px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
      .nav button, .subnav button { border: 0; border-radius: 4px; padding: 9px 14px; color: var(--muted); background: transparent; }
      .nav button[aria-current="page"], .subnav button[aria-current="page"] { color: var(--green); background: var(--green-soft); font-weight: 700; }
      main { padding-top: 30px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font: 500 42px/1.1 Georgia, "Times New Roman", serif; letter-spacing: 0; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { font-size: 17px; margin-bottom: 4px; }
      .eyebrow { color: var(--coral); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      .lede, .muted { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
      .list { display: grid; gap: 10px; max-width: 860px; }
      .list-row, .resource-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 17px 20px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .list-row button { color: inherit; text-align: left; border: 0; background: none; padding: 0; }
      .list-row strong { display: block; font-size: 16px; }
      .list-row small { color: var(--muted); }
      .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
      .resource { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
      .resource p { white-space: pre-wrap; color: var(--muted); }
      .resource a { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
      .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 22px; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
      .toolbar select, .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid #b9c8c0; border-radius: 3px; }
      .toolbar select { width: auto; min-width: 190px; }
      .button { min-height: 40px; padding: 9px 14px; border: 1px solid var(--green); border-radius: 3px; color: white; background: var(--green); font-weight: 700; }
      .button.secondary { color: var(--green); background: white; }
      .button.danger { border-color: var(--coral); color: white; background: var(--coral); }
      .button:disabled { opacity: .55; cursor: wait; }
      .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { max-width: 300px; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      th { position: sticky; top: 0; color: var(--muted); background: #edf2ef; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .actions { display: flex; gap: 8px; white-space: nowrap; }
      .link-button { border: 0; padding: 4px; color: var(--green); background: transparent; font-weight: 700; }
      .link-button:disabled { color: #84918c; cursor: not-allowed; }
      .editor { margin-top: 22px; padding: 22px; background: #e9efeb; border-top: 3px solid var(--green); }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .field { min-width: 0; display: grid; gap: 5px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
      .field.wide { grid-column: 1 / -1; }
      .field textarea { min-height: 100px; resize: vertical; }
      .field.check { align-content: start; }
      .field.check input { width: 18px; height: 18px; accent-color: var(--green); }
      .notice { margin: 14px 0; padding: 12px 14px; border-left: 3px solid var(--gold); background: #fff7de; color: #604c16; }
      .error { border-left-color: var(--coral); background: #fff0ec; color: #7c2b1b; }
      .empty { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed #b9c8c0; }
      .status { min-height: 24px; color: var(--coral); }
      .back { margin-bottom: 22px; }
      .student-greeting { padding: clamp(24px, 5vw, 56px); background: var(--surface); border-top: 4px solid var(--gold); box-shadow: var(--shadow); }
      .student-greeting h1 { max-width: 840px; }
      .journey-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; margin-top: 28px; align-items: start; }
      .journey-controls { padding: 18px; background: #e9efeb; border-top: 3px solid var(--green); }
      .journey-controls.collapsed { display: none; }
      .quick-todo { display: flex; gap: 6px; margin: 12px 0 20px; }
      .quick-todo input { min-width: 0; width: 100%; padding: 9px; border: 1px solid #b9c8c0; border-radius: 3px; }
      .filter-group { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid #cbd8d0; }
      .filter-group label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .filter-group input { accent-color: var(--green); }
      .timeline { display: grid; gap: 12px; min-width: 0; }
      .task-card { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px; padding: 17px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--green); }
      .task-card.system-task { border-left-color: var(--coral); }
      .task-card.student-task { border-left-color: var(--gold); }
      .task-card.completed { opacity: .72; }
      .task-card[draggable="true"] { cursor: grab; }
      .task-card.dragging { opacity: .4; }
      .task-card input[type="checkbox"] { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .task-card h3 { margin: 0 0 5px; }
      .task-card p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .task-card select, .task-card input[type="date"] { padding: 5px 7px; border: 1px solid var(--line); color: var(--ink); background: white; }
      .task-meta { display: grid; justify-items: end; gap: 7px; color: var(--muted); font-size: 12px; }
      .task-kind { color: var(--coral); font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .task-card.student-task .task-kind { color: #8a6713; }
      .todo-editor { display: grid; gap: 7px; margin-top: 9px; }
      .todo-editor input, .todo-editor textarea { width: 100%; padding: 7px; border: 1px solid var(--line); }
      .timeline-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .timeline-toolbar select { padding: 8px 10px; border: 1px solid var(--line); background: white; }
      .drop-hint { display: none; color: var(--green); font-size: 11px; }
      .task-card.drag-over .drop-hint { display: block; }
      .template-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; align-items: start; }
      .template-phase { min-width: 0; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .template-phase header p { margin-bottom: 14px; }
      .template-phase.drag-over { border-color: var(--coral); background: #fff8f5; }
      .template-list { display: grid; gap: 8px; }
      .template-card { display: grid; gap: 6px; min-width: 0; padding: 12px; background: #f7faf8; border: 1px solid var(--line); cursor: grab; overflow-wrap: anywhere; }
      .template-card small { color: var(--muted); }
      .template-card:active { cursor: grabbing; }
      #assignment-roster input[type="date"] { min-width: 140px; padding: 7px; border: 1px solid var(--line); background: white; }
      #assignment-roster td:first-child { width: 56px; }
      #assignment-roster input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); }
      .pathway { display: grid; gap: 18px; max-width: 980px; margin-top: 34px; }
      .pathway-phase { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .pathway-phase.locked { border-top-color: #aab7b0; }
      .phase-heading { display: flex; justify-content: space-between; gap: 18px; padding: 20px 22px 14px; }
      .phase-heading h2 { margin-bottom: 4px; font: 500 25px/1.2 Georgia, "Times New Roman", serif; }
      .phase-status { flex: none; align-self: start; padding: 4px 9px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 700; }
      .locked .phase-status { color: var(--muted); background: #edf0ee; }
      .phase-description { margin: 0 22px 14px; color: var(--muted); }
      .milestone-list { margin: 0; padding: 0; list-style: none; }
      .milestone-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: start; gap: 12px; padding: 15px 22px; border-top: 1px solid var(--line); }
      .milestone-item input { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .milestone-item h3 { margin: 0 0 4px; }
      .milestone-item p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .milestone-meta { color: var(--muted); font-size: 12px; text-align: right; }
      .milestone-type { color: var(--coral); font-size: 11px; font-weight: 750; text-transform: uppercase; }
      .section-gap { margin-top: 38px; }
      @media (max-width: 700px) {
        .topbar { align-items: flex-start; padding: 14px 16px; }
        .shell { padding: 16px 14px 36px; }
        .nav { overflow-x: auto; }
        .nav button { white-space: nowrap; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .form-grid { grid-template-columns: 1fr; }
        .field.wide { grid-column: auto; }
        .list-row { align-items: flex-start; }
        .account { max-width: 48%; overflow-wrap: anywhere; }
        h1 { font-size: 34px; }
        .template-phase { padding: 14px; }
        #assignment-roster td, #assignment-roster th { padding: 9px 8px; }
        #assignment-roster input[type="date"] { min-width: 128px; }
        .phase-heading { padding: 16px; }
        .phase-description { margin-inline: 16px; }
        .milestone-item { padding: 13px 16px; grid-template-columns: 24px minmax(0, 1fr); }
        .milestone-meta { grid-column: 2; text-align: left; }
        .journey-layout { grid-template-columns: 1fr; }
        .task-card { grid-template-columns: 24px minmax(0, 1fr); padding: 14px; }
        .task-meta { grid-column: 2; justify-items: start; grid-template-columns: repeat(2, max-content); align-items: center; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="shell"><p class="muted">Connecting to VSA EE Hub...</p></div></div>
    <script>
      const state = {
        user: null,
        view: 'home',
        cohortId: '',
        selectedStudent: null,
        adminEntity: 'cohorts',
        adminData: null,
        editingRecord: null,
        originalKey: '',
        status: '',
        selectedMemberIds: [],
        assignmentStudentIds: [],
        importRecords: null,
        journeyFilters: { phaseId: 'all', showSystem: true, showStudent: true },
        journeyControlsOpen: true
      };

      document.addEventListener('DOMContentLoaded', start);

      function start() {
        callServer('getAppBootstrap').then(function(result) {
          if (!result || !result.user) {
            showFatal('Access unavailable', 'Your signed-in account is not registered in the EE workbook.');
            return;
          }
          state.user = result.user;
          state.view = state.user.role === 'student' ? 'student' : 'staff';
          renderShell();
        }).catch(function(error) {
          showFatal('Unable to start', error.message || 'The application could not reach the EE workbook.');
        });
      }

      function callServer(method) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function(resolve, reject) {
          if (!window.google || !google.script || !google.script.run) {
            reject(new Error('Open this app from its Google Apps Script deployment.'));
            return;
          }
          const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error) {
            reject(new Error(error && error.message ? error.message : String(error)));
          });
          runner[method].apply(runner, args);
        });
      }

      function renderShell() {
        const tabs = state.user.role === 'student'
          ? [['student', 'My EE'], ['resources', 'Resources']]
          : [['staff', 'Cohorts'], ['resources', 'Resources']];
        if (state.user.permissions && state.user.permissions.canAdmin) tabs.push(['admin', 'Admin']);
        document.getElementById('app').innerHTML = `
          <header class="topbar">
            <div class="brand"><span class="brand-mark">EE</span><span>VSA EE HUB</span></div>
            <div class="account">${escapeHtml(state.user.displayName)}<br>${escapeHtml(state.user.email)}</div>
          </header>
          <div class="shell">
            <nav class="nav" aria-label="Main navigation">${tabs.map(function(tab) {
              return `<button type="button" data-view="${tab[0]}" aria-current="${state.view === tab[0] ? 'page' : 'false'}">${tab[1]}</button>`;
            }).join('')}</nav>
            <main id="main" aria-live="polite"></main>
          </div>`;
        document.querySelectorAll('[data-view]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.view = button.dataset.view;
            state.selectedStudent = null;
            state.status = '';
            renderShell();
          });
        });
        if (state.view === 'student') renderStudentView();
        else if (state.view === 'staff') renderStaffView();
        else if (state.view === 'resources') renderResources();
        else renderAdmin();
      }

      function renderStudentView() {
        const main = document.getElementById('main');
        main.innerHTML = '<p class="muted">Loading student view...</p>';
        const email = state.selectedStudent ? state.selectedStudent.email : '';
        const cohort = state.selectedStudent ? state.selectedStudent.cohortId : '';
        callServer('getStudentView', email, cohort).then(function(student) {
          main.innerHTML = `${state.selectedStudent ? '<button type="button" class="link-button back" id="back-to-roster">← Back to cohort</button>' : ''}
            <section class="student-greeting"><p class="eyebrow">Extended Essay</p><h1>Hello, ${escapeHtml(student.displayName)}</h1></section>
            ${renderActionTimeline(student.actionItems || [], email, cohort)}`;
          const back = document.getElementById('back-to-roster');
          if (back) back.addEventListener('click', function() { state.selectedStudent = null; renderStaffView(); });
          bindActionTimeline(main, email, cohort);
        }).catch(showError);
      }

      function renderActionTimeline(items) {
        const phases = Array.from(new Set(items.map(function(item) { return item.PhaseId; }).filter(Boolean))).sort();
        const isOwnStudentView = state.user.role === 'student' && !state.selectedStudent;
        return `<div class="timeline-toolbar"><button type="button" class="button secondary" id="toggle-journey-controls">${state.journeyControlsOpen ? 'Hide controls' : 'Show controls'}</button><span class="muted">${items.length} action items</span></div>
          <div class="journey-layout">
            <aside class="journey-controls ${state.journeyControlsOpen ? '' : 'collapsed'}" id="journey-controls">
              ${isOwnStudentView ? '<form class="quick-todo" id="quick-todo"><input id="quick-todo-title" maxlength="240" placeholder="Add a new To-Do..." aria-label="New To-Do"><button class="button" type="submit" title="Add To-Do">+</button></form>' : ''}
              <div class="filter-group"><strong>Phase</strong><label><input type="radio" name="phase-filter" value="all" ${state.journeyFilters.phaseId === 'all' ? 'checked' : ''}> All phases</label>${phases.map(function(phaseId) {
                return `<label><input type="radio" name="phase-filter" value="${escapeHtml(phaseId)}" ${state.journeyFilters.phaseId === phaseId ? 'checked' : ''}> ${escapeHtml(phaseId)}</label>`;
              }).join('')}</div>
              <div class="filter-group"><strong>Tasks</strong><label><input type="checkbox" data-creator-filter="System" ${state.journeyFilters.showSystem ? 'checked' : ''}> Official milestones</label><label><input type="checkbox" data-creator-filter="Student" ${state.journeyFilters.showStudent ? 'checked' : ''}> My To-Dos</label></div>
            </aside>
            <section class="timeline" id="action-timeline" aria-label="Extended Essay timeline">${items.length ? items.map(renderActionItem).join('') : '<div class="empty">No action items yet. Official milestones appear after your cohort is assigned.</div>'}</section>
          </div>`;
      }

      function renderActionItem(item) {
        const systemTask = item.CreatorType === 'System';
        const dateValue = item.DueDate ? String(item.DueDate).slice(0, 10) : '';
        return `<article class="task-card ${systemTask ? 'system-task' : 'student-task'} ${item.Status === 'Completed' ? 'completed' : ''}" data-task-id="${escapeHtml(item.TaskId)}" data-phase-id="${escapeHtml(item.PhaseId || '')}" data-creator-type="${escapeHtml(item.CreatorType)}" draggable="${item.canEdit ? 'true' : 'false'}">
          <div><select data-task-status="${escapeHtml(item.TaskId)}" aria-label="Task status" ${item.canUpdate ? '' : 'disabled'}>${['Pending', 'In Progress', 'Completed'].map(function(status) {
            return `<option value="${status}" ${item.Status === status ? 'selected' : ''}>${status}</option>`;
          }).join('')}</select></div>
          <div class="task-content"><span class="task-kind">${systemTask ? 'Official milestone' : 'My To-Do'}</span>
            ${item.canEdit ? `<div class="todo-editor"><input data-todo-title="${escapeHtml(item.TaskId)}" value="${escapeHtml(item.Title)}" maxlength="240" aria-label="To-Do title"><textarea data-todo-description="${escapeHtml(item.TaskId)}" aria-label="To-Do description">${escapeHtml(item.Description || '')}</textarea><button type="button" class="link-button" data-save-todo="${escapeHtml(item.TaskId)}">Save</button></div>` : `<h3>${escapeHtml(item.Title)}</h3><p>${escapeHtml(item.Description || '')}</p>`}
            ${item.canEdit ? '<span class="drop-hint">Drop to place this To-Do beside this date</span>' : ''}
          </div>
          <div class="task-meta"><strong>${escapeHtml(item.PhaseId || 'To-Do')}</strong>${dateValue ? `<time datetime="${escapeHtml(dateValue)}">${escapeHtml(dateValue)}</time>` : '<span>No due date</span>'}${item.canEdit ? `<input type="date" data-task-date="${escapeHtml(item.TaskId)}" value="${escapeHtml(dateValue)}" aria-label="To-Do due date">` : ''}</div>
        </article>`;
      }

      function bindActionTimeline(main, email, cohort) {
        const toggle = document.getElementById('toggle-journey-controls');
        toggle.addEventListener('click', function() {
          state.journeyControlsOpen = !state.journeyControlsOpen;
          renderStudentView();
        });
        const quickTodo = document.getElementById('quick-todo');
        if (quickTodo) quickTodo.addEventListener('submit', function(event) {
          event.preventDefault();
          const input = document.getElementById('quick-todo-title');
          callServer('addStudentTodo', input.value).then(renderStudentView).catch(showError);
        });
        main.querySelectorAll('[name="phase-filter"]').forEach(function(input) {
          input.addEventListener('change', function() { state.journeyFilters.phaseId = input.value; applyJourneyFilters(); });
        });
        main.querySelectorAll('[data-creator-filter]').forEach(function(input) {
          input.addEventListener('change', function() {
            if (input.dataset.creatorFilter === 'System') state.journeyFilters.showSystem = input.checked;
            else state.journeyFilters.showStudent = input.checked;
            applyJourneyFilters();
          });
        });
        main.querySelectorAll('[data-task-status]').forEach(function(input) {
          input.addEventListener('change', function() {
            input.disabled = true;
            callServer('setActionItemStatus', input.dataset.taskStatus, input.value, email, cohort).then(renderStudentView).catch(showError);
          });
        });
        main.querySelectorAll('[data-task-date]').forEach(function(input) {
          input.addEventListener('change', function() { callServer('setActionItemDueDate', input.dataset.taskDate, input.value).then(renderStudentView).catch(showError); });
        });
        main.querySelectorAll('[data-save-todo]').forEach(function(button) {
          button.addEventListener('click', function() {
            const card = button.closest('[data-task-id]');
            const title = card.querySelector('[data-todo-title]').value;
            const description = card.querySelector('[data-todo-description]').value;
            callServer('updateStudentTodo', button.dataset.saveTodo, title, description).then(renderStudentView).catch(showError);
          });
        });
        main.querySelectorAll('[data-task-id][draggable="true"]').forEach(function(card) {
          card.addEventListener('dragstart', function(event) { event.dataTransfer.setData('text/plain', card.dataset.taskId); card.classList.add('dragging'); });
          card.addEventListener('dragend', function() { card.classList.remove('dragging'); main.querySelectorAll('.drag-over').forEach(function(item) { item.classList.remove('drag-over'); }); });
        });
        main.querySelectorAll('[data-task-id]').forEach(function(card) {
          card.addEventListener('dragover', function(event) { event.preventDefault(); card.classList.add('drag-over'); });
          card.addEventListener('dragleave', function() { card.classList.remove('drag-over'); });
          card.addEventListener('drop', function(event) {
            event.preventDefault();
            card.classList.remove('drag-over');
            const taskId = event.dataTransfer.getData('text/plain');
            if (!taskId || taskId === card.dataset.taskId) return;
            const position = event.clientY < card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2 ? 'before' : 'after';
            callServer('repositionStudentTodo', taskId, card.dataset.taskId, position).then(renderStudentView).catch(showError);
          });
        });
        applyJourneyFilters();
      }

      function applyJourneyFilters() {
        document.querySelectorAll('#action-timeline [data-task-id]').forEach(function(card) {
          const creatorVisible = card.dataset.creatorType === 'System' ? state.journeyFilters.showSystem : state.journeyFilters.showStudent;
          const phaseVisible = state.journeyFilters.phaseId === 'all' || card.dataset.phaseId === state.journeyFilters.phaseId;
          card.classList.toggle('hidden', !creatorVisible || !phaseVisible);
        });
      }

      function renderStaffView() {
        const main = document.getElementById('main');
        if (state.selectedStudent) {
          renderStudentView();
          return;
        }
        if (state.cohortId) {
          main.innerHTML = `<button type="button" class="link-button back" id="back-to-cohorts">← All cohorts</button>
            <div class="page-head"><div><p class="eyebrow">Staff workspace</p><h1>Cohort ${escapeHtml(state.cohortId)}</h1><p class="lede">Select a student to open their view.</p></div></div>

      function parseRosterText(sourceText, requiredHeaders) {
        const firstLine = String(sourceText).split(/\r?\n/, 1)[0] || '';
        const delimiter = firstLine.indexOf('\t') >= 0 ? '\t' : ',';
        const rows = [];
        let row = [];
        let field = '';
        let quoted = false;
        const source = String(sourceText).replace(/^\uFEFF/, '');
        for (let index = 0; index < source.length; index++) {
          const character = source[index];
          if (character === '"') {
            if (quoted && source[index + 1] === '"') { field += '"'; index++; }
            else quoted = !quoted;
          } else if (!quoted && character === delimiter) {
            row.push(field);
            field = '';
          } else if (!quoted && (character === '\n' || character === '\r')) {
            if (character === '\r' && source[index + 1] === '\n') index++;
            row.push(field);
            if (row.some(function(value) { return value.trim() !== ''; })) rows.push(row);
            row = [];
            field = '';
          } else {
            field += character;
          }
        }
        if (quoted) throw new Error('A quoted field is not closed.');
        row.push(field);
        if (row.some(function(value) { return value.trim() !== ''; })) rows.push(row);
        if (rows.length < 2) throw new Error('Include a header row and at least one student.');

        const headers = rows.shift().map(function(value) { return value.trim(); });
        if (headers.some(function(header) { return !header; })) throw new Error('Every column needs a header.');
        if (new Set(headers).size !== headers.length) throw new Error('Duplicate column headers are ambiguous.');
        (requiredHeaders || []).forEach(function(header) {
          if (headers.indexOf(header) < 0) throw new Error('Missing required column: ' + header);
        });
        return rows.map(function(values, index) {
          if (values.length > headers.length) throw new Error('Row ' + (index + 2) + ' has more values than headers.');
          const record = {};
          headers.forEach(function(header, column) { record[header] = (values[column] || '').trim(); });
          return record;
        });
      }

      function openEditor(record, preserve, phaseOptionsLoaded) {
        const data = state.adminData || { headers: [] };
        const entity = state.adminEntity;
        const fields = data.schema && data.schema.fields ? data.schema.fields : (data.headers || []).map(function(name) { return { name: name }; });
        state.editingRecord = record ? { record: record } : (preserve ? state.editingRecord : null);
        const editing = !!record || !!(preserve && state.originalKey);
        state.originalKey = editing ? keyValue(entity, record || state.editingRecord.record) : '';
        const editor = document.getElementById('record-editor');
        editor.innerHTML = `<section class="editor"><h2>${editing ? 'Edit record' : 'Add record'}</h2>
          ${entity === 'studentUsers' && !editing ? '<div id="cohort-import"></div>' : ''}
          <form id="record-form"><div class="form-grid">${fields.map(function(field) { return fieldMarkup(field, record ? record[field.name] : '', editing); }).join('')}</div>
            <div class="toolbar"><button class="button" type="submit">Save</button><button class="button secondary" type="button" id="cancel-edit">Cancel</button></div></form></section>`;
        const form = document.getElementById('record-form');
        form.addEventListener('submit', saveForm);
        document.getElementById('cancel-edit').addEventListener('click', function() {
          state.editingRecord = null;
          state.originalKey = '';
          document.getElementById('record-editor').innerHTML = '';
        });
        if (entity === 'studentUsers' && !editing) renderCohortImport();
      }

      function fieldMarkup(field, value, editing) {
        const name = field.name;
        const required = field.required ? 'required' : '';
        const disabled = (editing && field.key) || field.editable === false ? 'disabled' : '';
        const label = field.label || name;
        const wide = field.type === 'textarea' ? 'wide' : '';
        const currentValue = value === undefined || value === null ? (field.defaultValue === undefined ? '' : field.defaultValue) : value;
        if (field.type === 'checkbox') {
          const checked = toBoolean(currentValue);
          return `<div class="field check"><label><input type="checkbox" data-field="${escapeHtml(name)}" ${checked ? 'checked' : ''} ${disabled}> ${escapeHtml(label)}</label></div>`;
        }
        if (field.type === 'select') {
          const options = field.options || [];
          const blankOption = field.allowBlank ? `<option value="">No prerequisite</option>` : `<option value="">Choose ${escapeHtml(label)}</option>`;
          return `<div class="field"><label>${escapeHtml(label)}${required ? ' *' : ''}</label><select data-field="${escapeHtml(name)}" ${required} ${disabled}>${blankOption}${options.map(function(option) {
            const item = typeof option === 'string' ? { value: option, label: option } : option;
            return `<option value="${escapeHtml(item.value)}" ${String(currentValue) === String(item.value) ? 'selected' : ''}>${escapeHtml(item.label)}</option>`;
          }).join('')}</select></div>`;
        }
        const inputType = ['text', 'email', 'url', 'number', 'date'].indexOf(field.type) >= 0 ? field.type : 'text';
        const formatted = escapeHtml(formatValue(currentValue));
        const control = field.type === 'textarea'
          ? `<textarea data-field="${escapeHtml(name)}" ${required} ${disabled}>${formatted}</textarea>`
          : `<input type="${inputType}" data-field="${escapeHtml(name)}" value="${formatted}" ${required} ${disabled}>`;
        return `<div class="field ${wide}"><label>${escapeHtml(label)}${required ? ' *' : ''}</label>${control}</div>`;
      }

      function renderCohortImport() {
        const target = document.getElementById('cohort-import');
        target.innerHTML = '<div class="toolbar"><button type="button" class="button secondary" id="show-cohort-import">Fill from cohort roster</button></div>';
        document.getElementById('show-cohort-import').addEventListener('click', function() {
          callServer('getCohorts').then(function(cohorts) {
            if (!cohorts.length) { target.innerHTML = '<p class="notice">No cohorts are available.</p>'; return; }
            target.innerHTML = `<div class="toolbar"><label for="import-cohort">Cohort</label><select id="import-cohort">${cohorts.map(function(cohort) {
              return `<option value="${escapeHtml(cohort.id)}">${escapeHtml(cohort.name)}</option>`;
            }).join('')}<option value=""></option></select><label for="import-student">Student</label><select id="import-student"><option value="">Choose a student</option></select></div>`;
            const cohortSelect = document.getElementById('import-cohort');
            const studentSelect = document.getElementById('import-student');
            function loadMembers() {
              if (!cohortSelect.value) return;
              callServer('getCohortMembersForAdmin', cohortSelect.value).then(function(result) {
                studentSelect.innerHTML = '<option value="">Choose a student</option>' + (result.records || []).map(function(member, index) {
                  return `<option value="${index}" ${member.hasStudentIdConflict ? 'disabled' : ''}>${escapeHtml(member['Display Name'] || member.StudentId)} · ${escapeHtml(member.StudentId)}${member.hasStudentIdConflict ? ' · ID conflict' : ''}</option>`;
                }).join('');
                studentSelect.onchange = function() {
                  const member = result.records[Number(studentSelect.value)];
                  if (!member) return;
                  setField('DisplayName', member['Display Name']);
                  setField('Cohort', cohortSelect.value);
                  setField('StudentId', member.StudentId);
                  setField('studentEmail', member['Student Email']);
                  setField('parentEmail', member['Family Email']);
                };
              }).catch(showError);
            }
            cohortSelect.addEventListener('change', loadMembers);
            loadMembers();
          }).catch(showError);
        });
      }

      function setField(name, value) {
        const input = document.querySelector(`[data-field="${cssEscape(name)}"]`);
        if (input && !input.disabled) input.value = value || '';
      }

      function saveForm(event) {
        event.preventDefault();
        const entity = state.adminEntity;
        const form = event.currentTarget;
        const record = {};
        form.querySelectorAll('[data-field]').forEach(function(input) {
          if (input.type === 'checkbox') record[input.dataset.field] = input.checked;
          else record[input.dataset.field] = input.value;
        });
        const submit = form.querySelector('[type="submit"]');
        submit.disabled = true;
        const request = entity === 'cohortMembers'
          ? callServer('saveCohortMember', state.cohortId, record, state.originalKey || '')
          : callServer('saveAdminRecord', entity, record, state.originalKey || '');
        request.then(function(result) {
          state.status = result && result.auditWarning ? 'Saved, but the completion audit entry could not be written. Check AUDIT_LOGS.' : 'Saved.';
          state.editingRecord = null;
          state.originalKey = '';
          loadAdminSection();
        }).catch(function(error) {
          submit.disabled = false;
          showError(error);
        });
      }

      function removeRecord(record) {
        const entity = state.adminEntity;
        const key = keyValue(entity, record);
        const noun = entity === 'cohorts' ? 'archive this cohort' : 'delete this record';
        if (!window.confirm(`Are you sure you want to ${noun}?`)) return;
        const request = entity === 'cohortMembers'
          ? callServer('deleteCohortMember', state.cohortId, key)
          : callServer('deleteAdminRecord', entity, key);
        request.then(function(result) {
          state.status = result && result.auditWarning ? 'Change saved, but the completion audit entry could not be written.' : 'Change saved.';
          state.editingRecord = null;
          loadAdminSection();
        }).catch(showError);
      }

      function keyValue(entity, record) {
        if (!record || !state.adminData || !state.adminData.schema) return '';
        var key = state.adminData.schema.fields.filter(function(field) { return field.key; })[0];
        return key ? record[key.name] || '' : '';
      }

      function sectionLabel(entity) {
        const item = adminSections.filter(function(section) { return section[0] === entity; })[0];
        return item ? item[1] : entity;
      }

      function formatValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return String(value);
      }

      function toBoolean(value) {
        return value === true || value === 1 || ['true', '1', 'yes'].indexOf(String(value || '').toLowerCase()) >= 0;
      }

      function safeUrl(value) {
        try {
          const parsed = new URL(String(value || ''));
          return parsed.protocol === 'https:' ? parsed.href : '';
        } catch (error) { return ''; }
      }

      function cssEscape(value) {
        return String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      }

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function showError(error) {
        const message = error && error.message ? error.message : String(error);
        const main = document.getElementById('main');
        const admin = document.getElementById('admin-content');
        const target = admin || main;
        if (target) target.innerHTML = `<p class="notice error">${escapeHtml(message)}</p>`;
      }

      function showFatal(title, message) {
        document.getElementById('app').innerHTML = `<div class="shell"><p class="eyebrow">VSA EE Hub</p><h1>${escapeHtml(title)}</h1><p class="notice error">${escapeHtml(message)}</p></div>`;
      }
    </script>
  </body>
</html>
