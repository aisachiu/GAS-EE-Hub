<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #004C80;
        --muted: #536273;
        --paper: #FFFFFF;
        --surface: #ffffff;
        --line: #E9ECEF;
        --green: #20C997;
        --green-soft: #E8F8F3;
        --coral: #88002B;
        --gold: #FF5A36;
        --shadow: 0 4px 14px rgba(0, 76, 128, .08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: #263746; font: 14px/1.4 Helvetica, "Heiti TC", Arial, sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px clamp(12px, 2.5vw, 32px); background: var(--ink); color: white; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink); background: white; font: 700 11px Helvetica, Arial, sans-serif; }
      .account { display: flex; align-items: center; gap: 8px; color: #e8f0f5; text-align: right; font-size: 11px; line-height: 1.25; }
      .request-indicator { display: inline-flex; align-items: center; gap: 6px; min-height: 16px; color: #e8f0f5; font-size: 10px; opacity: 0; transition: opacity .18s ease; }
      .request-indicator.active { opacity: 1; }
      .request-indicator::before { width: 8px; height: 8px; border: 2px solid rgba(232, 240, 245, .35); border-top-color: var(--green); border-radius: 50%; content: ''; animation: request-spin .8s linear infinite; }
      @keyframes request-spin { to { transform: rotate(360deg); } }
      .shell { max-width: 1440px; margin: 0 auto; padding: 10px clamp(12px, 2.5vw, 32px) 32px; }
      .nav { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .nav button, .subnav button { border: 0; border-radius: 3px; padding: 6px 10px; color: var(--muted); background: transparent; font-size: 13px; }
      .nav button[aria-current="page"], .subnav button[aria-current="page"] { color: var(--green); background: var(--green-soft); font-weight: 700; }
      main { padding-top: 14px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font: 600 28px/1.15 Helvetica, "Heiti TC", Arial, sans-serif; letter-spacing: 0; }
      h2 { font-size: 18px; line-height: 1.2; }
      h3 { font-size: 15px; margin-bottom: 3px; }
      .eyebrow { color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .lede, .muted { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .list { display: grid; gap: 7px; max-width: 860px; }
      .list-row, .resource-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .list-row button { color: inherit; text-align: left; border: 0; background: none; padding: 0; }
      .list-row strong { display: block; font-size: 16px; }
      .list-row small { color: var(--muted); }
      .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
      .resource { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
      .resource p { white-space: pre-wrap; color: var(--muted); }
      .resource a { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
      .subnav { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 14px; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
      .toolbar select, .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 7px 9px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 3px; }
      .toolbar select { width: auto; min-width: 170px; }
      .button { min-height: 32px; padding: 6px 10px; border: 1px solid var(--gold); border-radius: 3px; color: white; background: var(--gold); font-weight: 700; }
      .button.secondary { border-color: var(--ink); color: var(--ink); background: white; }
      .button.danger { border-color: var(--coral); color: white; background: var(--coral); }
      .button:disabled { opacity: .55; cursor: wait; }
      .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { max-width: 300px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      th { position: sticky; top: 0; color: var(--muted); background: var(--line); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .actions { display: flex; gap: 8px; white-space: nowrap; }
      .link-button { border: 0; padding: 4px; color: var(--green); background: transparent; font-weight: 700; }
      .link-button:disabled { color: #84918c; cursor: not-allowed; }
      .editor { margin-top: 14px; padding: 14px; background: #f8fafb; border-top: 3px solid var(--green); }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .field { min-width: 0; display: grid; gap: 5px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
      .field.wide { grid-column: 1 / -1; }
      .field textarea { min-height: 76px; resize: vertical; }
      .field.check { align-content: start; }
      .field.check input { width: 18px; height: 18px; accent-color: var(--green); }
      .notice { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--gold); background: #fff5f1; color: #663020; }
      .error { border-left-color: var(--coral); background: #fff0ec; color: #7c2b1b; }
      .empty { padding: 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }
      .status { min-height: 24px; color: var(--coral); }
      .back { margin-bottom: 22px; }
      .student-greeting { padding: 16px 18px; background: var(--surface); border-top: 3px solid var(--gold); box-shadow: var(--shadow); }
      .student-greeting h1 { max-width: 840px; }
      .journey-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
      .journey-controls { padding: 12px; background: #f8fafb; border-top: 3px solid var(--green); }
      .journey-controls.collapsed { display: none; }
      .quick-todo { display: flex; gap: 5px; margin: 8px 0 14px; }
      .quick-todo input { min-width: 0; width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 3px; }
      .filter-group { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
      .filter-group label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .filter-group input { accent-color: var(--green); }
      .timeline { display: grid; gap: 8px; min-width: 0; }
      .task-card { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .task-card.system-task { border-left-color: var(--coral); }
      .task-card.student-task { border-left-color: var(--gold); }
      .task-card.completed { opacity: .72; }
      .task-card[draggable="true"] { cursor: grab; }
      .task-card.dragging { opacity: .4; }
      .task-card input[type="checkbox"] { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .task-card h3 { margin: 0 0 5px; }
      .task-card p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .task-card select, .task-card input[type="date"] { padding: 4px 6px; border: 1px solid var(--line); color: var(--ink); background: white; font-size: 12px; }
      .task-meta { display: grid; justify-items: end; gap: 7px; color: var(--muted); font-size: 12px; }
      .task-kind { color: var(--coral); font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .task-card.student-task .task-kind { color: var(--gold); }
      .todo-editor { display: grid; gap: 7px; margin-top: 9px; }
      .todo-editor input, .todo-editor textarea { width: 100%; padding: 6px; border: 1px solid var(--line); }
      .timeline-toolbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
      .timeline-toolbar select { padding: 6px 8px; border: 1px solid var(--line); background: white; }
      .journey { display: grid; gap: 12px; }
      .journey-head { display: flex; justify-content: space-between; gap: 8px 12px; align-items: end; flex-wrap: wrap; }
      .journey-head h1 { margin-bottom: 0; }
      .journey-score { margin: 0; text-align: right; color: var(--muted); }
      .journey-score strong { display: block; color: var(--ink); font-size: 22px; line-height: 1; }
      .journey-bar { height: 6px; border-radius: 999px; background: #e7eef3; overflow: hidden; }
      .journey-bar span { display: block; height: 100%; background: var(--green); }
      .journey-path { display: flex; gap: 0; margin: 0; padding: 4px 0 0; list-style: none; overflow-x: auto; position: relative; }
      .journey-path > li { flex: 1 1 0; min-width: 0; }
      .journey-path::before { content: ''; position: absolute; left: 12%; right: 12%; top: 16px; height: 2px; background: #d5e0e8; }
      .phase-stop { position: relative; z-index: 1; display: grid; justify-items: center; gap: 3px; width: 100%; border: 0; padding: 0 6px 4px; background: transparent; color: var(--muted); }
      .phase-mark { width: 16px; height: 16px; border: 2px solid #c5d3de; border-radius: 50%; background: white; }
      .phase-stop.done { color: #0d7a5f; }
      .phase-stop.done .phase-mark { border-color: var(--green); background: var(--green); }
      .phase-stop.here { color: var(--ink); font-weight: 700; }
      .phase-stop.here .phase-mark { border-color: var(--ink); background: var(--ink); box-shadow: 0 0 0 4px rgba(0, 76, 128, .16); }
      .phase-stop[aria-pressed="true"] .phase-name { color: var(--gold); }
      .phase-name { font-size: 12px; line-height: 1.15; }
      .phase-count { font-size: 11px; }
      .journey-filters { display: flex; flex-wrap: wrap; gap: 6px; }
      .journey-filters button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: white; color: var(--muted); font-weight: 700; }
      .journey-filters button[aria-pressed="true"] { border-color: var(--ink); color: white; background: var(--ink); }
      .here-card { padding: 14px 16px; color: white; background: var(--ink); border-left: 5px solid var(--gold); }
      .here-card h2, .here-card p { color: white; }
      .here-card .muted, .here-card .eyebrow { color: #d5e4ef; }
      .journey-phase { background: white; border: 1px solid var(--line); }
      .journey-phase.here { border-top: 3px solid var(--gold); }
      .journey-phase header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 10px 12px 0; }
      .journey-phase h2 { margin: 0; font-size: 18px; }
      .steps-rail { list-style: none; margin: 0; padding: 8px 12px 12px; }
      .journey .step { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; text-align: left; font-size: 14px; font-weight: 400; color: inherit; }
      .journey .step + .step { border-top: 1px solid var(--line); }
      .rail { width: 12px; height: 12px; margin-top: 4px; border: 2px solid #c5d3de; border-radius: 50%; background: white; }
      .journey .step.done .rail { border-color: var(--green); background: var(--green); }
      .journey .step.here .rail { border-color: var(--ink); background: var(--ink); }
      .journey .step.todo .rail { border-color: var(--gold); }
      .journey .step.done h3 { color: var(--muted); font-weight: 600; }
      .step-top { display: flex; justify-content: space-between; gap: 6px 10px; align-items: baseline; flex-wrap: wrap; }
      .step-top h3 { margin: 0; font-size: 15px; }
      .journey .step p { margin: 3px 0 0; }
      .journey-panel { position: fixed; top: 0; right: 0; z-index: 25; height: 100vh; width: 36px; overflow: hidden; background: var(--ink); transition: width .2s ease; }
      .journey-panel.open { width: clamp(300px, 34vw, 420px); background: #f6f8f9; border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 30, 50, .12); }
      .journey-peek { position: absolute; top: 40px; right: auto; bottom: 0; left: 0; width: 36px; border: 0; color: white; background: transparent; writing-mode: vertical-rl; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .journey-panel.open .journey-peek { display: none; }
      .journey-panel:not(.open) .journey-drawer { visibility: hidden; }
      .journey-drawer { width: clamp(300px, 34vw, 420px); height: 100%; display: flex; flex-direction: column; background: #f6f8f9; }
      .journey-panel-bar { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 10px; color: white; background: var(--ink); flex: none; }
      .journey-panel-bar button { border: 0; color: white; background: transparent; font-weight: 700; }
      .journey-scroll { flex: 1; overflow: auto; padding: 10px; }
      .journey-panel h1 { font-size: 20px; }
      .journey-panel .here-card h2 { font-size: 16px; }
      .journey-panel .journey-filters button { padding: 4px 8px; font-size: 12px; }
      .journey-toggle { border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 3px 10px; color: white; background: transparent; font-weight: 700; }
      .journey-toggle[aria-expanded="true"] { color: var(--ink); background: white; }
      body.has-journey { padding-right: 36px; transition: padding-right .2s ease; }
      body.has-journey.journey-open { padding-right: clamp(300px, 34vw, 420px); }
      .topbar { position: sticky; top: 0; z-index: 30; }
      .step-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
      .add-todo { display: flex; gap: 6px; padding: 0 12px 12px; }
      .add-todo input { min-width: 0; flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; }
      .todo-edit { display: grid; gap: 6px; margin-top: 8px; }
      .todo-edit input, .todo-edit textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); }
      .drop-hint { display: none; color: var(--green); font-size: 11px; }
      .task-card.drag-over .drop-hint { display: block; }
      .template-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; align-items: start; }
      .template-phase { min-width: 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .template-phase header p { margin-bottom: 9px; }
      .template-phase.drag-over { border-color: var(--coral); background: #fff8f5; }
      .template-list { display: grid; gap: 5px; }
      .template-card { display: grid; gap: 4px; min-width: 0; padding: 8px 10px; background: #f8fafb; border: 1px solid var(--line); cursor: grab; overflow-wrap: anywhere; font-size: 13px; }
      .sync-pending { border-color: var(--coral) !important; box-shadow: 0 0 0 2px rgba(189, 83, 62, .2); }
      .sync-confirmed { animation: sync-confirmed .85s ease both; }
      .sync-rejected { animation: sync-rejected .85s ease both; }
      @keyframes sync-confirmed { 0%, 100% { box-shadow: 0 0 0 0 rgba(20, 116, 95, 0); } 35% { box-shadow: 0 0 0 4px rgba(20, 116, 95, .45); } }
      @keyframes sync-rejected { 0%, 100% { box-shadow: 0 0 0 0 rgba(189, 83, 62, 0); } 35% { box-shadow: 0 0 0 4px rgba(189, 83, 62, .5); } }
      .template-card small { color: var(--muted); }
      .template-card:active { cursor: grabbing; }
      #assignment-roster input[type="date"] { min-width: 140px; padding: 7px; border: 1px solid var(--line); background: white; }
      #assignment-roster td:first-child { width: 56px; }
      #assignment-roster input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); }
      .pathway { display: grid; gap: 12px; max-width: 980px; margin-top: 18px; }
      .pathway-phase { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .pathway-phase.locked { border-top-color: var(--line); }
      .phase-heading { display: flex; justify-content: space-between; gap: 14px; padding: 13px 15px 9px; }
      .phase-heading h2 { margin-bottom: 3px; font: 600 18px/1.2 Helvetica, "Heiti TC", Arial, sans-serif; }
      .phase-status { flex: none; align-self: start; padding: 4px 9px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 700; }
      .locked .phase-status { color: var(--muted); background: var(--line); }
      .phase-description { margin: 0 15px 9px; color: var(--muted); }
      .milestone-list { margin: 0; padding: 0; list-style: none; }
      .milestone-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 10px 15px; border-top: 1px solid var(--line); }
      .milestone-item input { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .milestone-item h3 { margin: 0 0 4px; }
      .milestone-item p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .milestone-meta { color: var(--muted); font-size: 12px; text-align: right; }
      .milestone-type { color: var(--coral); font-size: 11px; font-weight: 750; text-transform: uppercase; }
      .section-gap { margin-top: 38px; }
      .hidden { display: none !important; }
      .dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--gold); vertical-align: 1px; }
      .faq-list, .ticket-list { display: grid; gap: 8px; max-width: 860px; }
      .faq, .ticket { background: white; border: 1px solid var(--line); border-left: 3px solid var(--ink); }
      .faq { padding: 10px 12px; }
      .faq p, .msg p { margin: 4px 0 0; white-space: pre-wrap; }
      .ticket summary { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; cursor: pointer; }
      .ticket .body { display: grid; gap: 8px; padding: 0 12px 12px; }
      .msg { padding: 8px 10px; background: #f8fafb; border-left: 3px solid var(--line); }
      .msg.staff { border-left-color: var(--ink); }
      .msg.mine { border-left-color: var(--gold); }
      .cats { display: flex; flex-wrap: wrap; gap: 6px; }
      .cats button, .chip.c-sm, .chip.c-cit, .chip.c-eth, .chip.c-ext, .chip.c-tech { border: 1px solid transparent; border-radius: 999px; }
      .cats button { padding: 4px 10px; }
      .cats button[aria-pressed="false"] { background: white; color: #3d4d5c; border-color: var(--line); }
      .cats button[aria-pressed="true"] { font-weight: 700; }
      .c-sm { background: #e7f1f8; color: var(--ink); }
      .c-cit { background: var(--green-soft); color: #0d7a5f; }
      .c-eth { background: #fff1e8; color: #8a3b12; }
      .c-ext { background: #fde8ea; color: var(--coral); }
      .c-tech { background: #eef3f6; color: #3d4d5c; }
      .staff-pill { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.16); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .tabs { display: flex; gap: 2px; align-self: stretch; min-width: 0; overflow-x: auto; }
      .tabs button { border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: #d5e4ef; background: transparent; font-weight: 700; white-space: nowrap; }
      .tabs button[aria-current="page"] { color: white; border-bottom-color: var(--gold); }
      .topbar { min-height: 40px; padding: 0 12px; }
      main { max-width: 1180px; margin: 0 auto; padding: 10px; container-type: inline-size; }
      @container (max-width: 760px) {
        .tiles, .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .doc-grid { grid-template-columns: 1fr; }
      }
      .hero { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; color: white; background: var(--ink); border-left: 5px solid var(--gold); }
      .hero p { margin: 0; color: #d5e4ef; }
      .hero h2 { margin: 2px 0 4px; color: white; }
      .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
      .tile, .scard, .strip, .doc-card { padding: 10px 12px; background: white; border: 1px solid var(--line); }
      .tile .val { font-size: 20px; font-weight: 700; color: var(--ink); }
      .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; margin: 8px 0 0; padding: 0; }
      .steps .step { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }
      .steps .step.current { color: var(--ink); }
      .steps .step.done { color: var(--green); }
      .segs { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
      .segs i { display: block; height: 7px; border-radius: 2px; background: var(--line); }
      .segs i.d { background: var(--ink); } .segs i.p { background: var(--gold); } .segs i.l { background: var(--coral); }
      .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
      .scard button.name { border: 0; padding: 0; background: none; color: var(--ink); font-weight: 700; font-size: 16px; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; background: #eef3f6; color: #3d4d5c; font-size: 12px; font-weight: 700; }
      .chip.bad { background: #fde8ea; color: var(--coral); }
      .chip.ok { background: var(--green-soft); color: #0d7a5f; }
      .form-dialog { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 12px; background: rgba(0, 30, 50, .45); }
      .form-dialog[hidden] { display: none; }
      .form-panel { width: min(720px, 100%); max-height: calc(100vh - 24px); overflow: auto; padding: 14px; background: white; border-top: 4px solid var(--gold); }
      .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .milestone-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      @media (max-width: 800px) { .tiles, .steps, .doc-grid { grid-template-columns: 1fr 1fr; } .topbar { flex-wrap: wrap; } }
      @media (max-width: 700px) {
        .topbar { align-items: flex-start; padding: 14px 16px; }
        .shell { padding: 16px 14px 36px; }
        .nav { overflow-x: auto; }
        .nav button { white-space: nowrap; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .form-grid { grid-template-columns: 1fr; }
        .field.wide { grid-column: auto; }
        .list-row { align-items: flex-start; }
        .account { max-width: 48%; overflow-wrap: anywhere; }
        h1 { font-size: 25px; }
        .template-phase { padding: 14px; }
        #assignment-roster td, #assignment-roster th { padding: 9px 8px; }
        #assignment-roster input[type="date"] { min-width: 128px; }
        .phase-heading { padding: 16px; }
        .phase-description { margin-inline: 16px; }
        .milestone-item { padding: 13px 16px; grid-template-columns: 24px minmax(0, 1fr); }
        .milestone-meta { grid-column: 2; text-align: left; }
        .journey-layout { grid-template-columns: 1fr; }
        .task-card { grid-template-columns: 24px minmax(0, 1fr); padding: 14px; }
        .task-meta { grid-column: 2; justify-items: start; grid-template-columns: repeat(2, max-content); align-items: center; }
      }
      @media (max-width: 720px) {
        .journey-panel.open { z-index: 40; width: min(100vw - 12px, 420px); }
        .journey-panel.open .journey-drawer { width: min(100vw - 12px, 420px); }
        body.has-journey.journey-open { padding-right: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="shell"><p class="muted">Connecting to VSA EE Hub...</p></div></div>
    <script>
      const state = {
        user: null,
        view: 'home',
        cohortId: '',
        selectedStudent: null,
        adminEntity: 'cohorts',
        adminData: null,
        editingRecord: null,
        originalKey: '',
        status: '',
        selectedMemberIds: [],
        assignmentStudentIds: [],
        importRecords: null,
        journeyOpen: false,
        studentHomeRequest: null,
        journeyFilters: { phaseId: 'all', showSystem: true, showStudent: true },
        journeyControlsOpen: true,
        editingTodo: '',
        section: '',
        actingAs: '',
        studentHome: null,
        staffHome: null,
        staffStudent: null,
        staffQuery: '',
        staffTicketUnread: 0,
        ticketBadgeFor: '',
        requests: { active: 0, nextId: 0 },
        mutationQueues: {}
      };

      document.addEventListener('DOMContentLoaded', start);

      function start() {
        callServer('getAppBootstrap').then(function(result) {
          if (!result || !result.user) {
            showFatal('Access unavailable', 'Your signed-in account is not registered in the EE workbook.');
            return;
          }
          state.user = result.user;
          state.view = state.user.role === 'student' ? 'home' : 'students';
          state.section = state.view;
          if (state.user.permissions && state.user.permissions.canAdmin) state.actingAs = 'coordinator';
          else if (state.user.permissions && state.user.permissions.isSupervisor) state.actingAs = 'supervisor';
          else state.actingAs = 'staff';
          renderShell();
        }).catch(function(error) {
          showFatal('Unable to start', error.message || 'The application could not reach the EE workbook.');
        });
      }

      function callServer(method) {
        const args = Array.prototype.slice.call(arguments, 1);
        beginRequest(method);
        return new Promise(function(resolve, reject) {
          if (!window.google || !google.script || !google.script.run) {
            endRequest(method);
            reject(new Error('Open this app from its Google Apps Script deployment.'));
            return;
          }
          const runner = google.script.run.withSuccessHandler(function(result) {
            endRequest(method);
            resolve(result);
          }).withFailureHandler(function(error) {
            endRequest(method);
            reject(new Error(error && error.message ? error.message : String(error)));
          });
          runner[method].apply(runner, args);
        });
      }

      function runMutation(method, args, options) {
        const config = options || {};
        const queueKey = config.key || method;
        const prior = state.mutationQueues[queueKey] || Promise.resolve();
        const operation = prior.catch(function() {}).then(function() {
          const operationId = ++state.requests.nextId;
          if (config.start) config.start(operationId);
          return callServer.apply(null, [method].concat(args || [])).then(function(result) {
            if (config.confirm) config.confirm(result, operationId);
            return result;
          }).catch(function(error) {
            if (config.reject) {
              config.reject(error, operationId);
              return { rejected: true, error: error };
            }
            throw error;
          });
        });
        state.mutationQueues[queueKey] = operation.catch(function() {});
        return operation;
      }

      function beginRequest(label) {
        state.requests.active += 1;
        const indicator = document.getElementById('request-indicator');
        if (indicator) {
          indicator.textContent = label ? 'Saving ' + humanizeRequestLabel(label) + '...' : 'Working...';
          indicator.classList.add('active');
          indicator.setAttribute('aria-busy', 'true');
        }
      }

      function endRequest() {
        state.requests.active = Math.max(0, state.requests.active - 1);
        const indicator = document.getElementById('request-indicator');
        if (indicator && state.requests.active === 0) {
          indicator.textContent = '';
          indicator.classList.remove('active');
          indicator.setAttribute('aria-busy', 'false');
        }
      }

      function humanizeRequestLabel(label) {
        return String(label).replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
      }

      function markSync(element, status) {
        if (!element) return;
        element.classList.remove('sync-pending', 'sync-confirmed', 'sync-rejected');
        if (status === 'pending') {
          element.classList.add('sync-pending');
          element.setAttribute('aria-busy', 'true');
          return;
        }
        element.setAttribute('aria-busy', 'false');
        if (status === 'confirmed' || status === 'rejected') {
          element.classList.add('sync-' + status);
          window.setTimeout(function() { element.classList.remove('sync-' + status); }, 900);
        }
      }

      function renderShell() {
        const student = state.user.role === 'student';
        const permissions = state.user.permissions || {};
        const tabs = student
          ? [['home', 'Home'], ['mywork', 'My Work'], ['resources', 'Resources'], ['help', 'Help']]
          : [['students', 'My Students'], ['resources', 'Resources']];
        if (!student && (state.actingAs === 'supervisor' || state.actingAs === 'coordinator') && (permissions.isSupervisor || permissions.canAdmin)) {
          tabs.splice(1, 0, ['tickets', 'Tickets']);
        }
        if (permissions.canAdmin) tabs.push(['admin', 'Admin']);
        if (!tabs.some(function(tab) { return tab[0] === state.section; })) state.section = tabs[0][0];
        state.view = state.section;
        document.body.classList.toggle('has-journey', student);
        document.body.classList.toggle('journey-open', student && state.journeyOpen);
        document.getElementById('app').innerHTML = `
          <header class="topbar">
            <div class="brand"><span class="brand-mark">EE</span><span>EE Hub</span>${student ? '' : '<span class="staff-pill">Staff</span>'}</div>
            <nav class="tabs" aria-label="Sections">${tabs.map(function(tab) {
              return `<button type="button" data-view="${tab[0]}" aria-current="${state.section === tab[0] ? 'page' : 'false'}">${tabLabel(tab)}</button>`;
            }).join('')}</nav>
            <div class="account">${student ? `<button type="button" class="journey-toggle" id="journey-toggle" aria-expanded="${state.journeyOpen ? 'true' : 'false'}" aria-controls="journey-panel">Journey</button>` : ''}<span id="request-indicator" class="request-indicator" aria-live="polite" aria-busy="false"></span><div>${escapeHtml(state.user.displayName)}</div></div>
          </header>
          <div id="feedback-region" aria-live="polite"></div>
          <main id="main"></main>
          ${student ? `<aside id="journey-panel" class="journey-panel${state.journeyOpen ? ' open' : ''}" aria-label="Journey and to-dos">
            <button type="button" class="journey-peek" id="journey-peek" aria-expanded="${state.journeyOpen ? 'true' : 'false'}" aria-controls="journey-drawer">Journey</button>
            <div class="journey-drawer" id="journey-drawer"${state.journeyOpen ? '' : ' inert'} aria-hidden="${state.journeyOpen ? 'false' : 'true'}">
              <div class="journey-panel-bar"><strong>Journey</strong><button type="button" id="journey-close">Close</button></div>
              <div id="journey-body" class="journey-scroll"></div>
            </div>
          </aside>` : ''}
          <div id="form-dialog" class="form-dialog" hidden></div>`;
        document.querySelectorAll('[data-view]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.section = button.dataset.view;
            state.view = state.section;
            state.selectedStudent = null;
            state.staffStudent = null;
            state.status = '';
            renderShell();
          });
        });
        if (state.section === 'admin') renderAdmin();
        else if (state.section === 'resources') renderResources();
        else if (state.section === 'help') renderStudentHelp();
        else if (state.section === 'tickets') renderStaffTickets();
        else if (student) renderStudentSection();
        else renderStaffHome();
        if (student) {
          const journeyToggle = document.getElementById('journey-toggle');
          const journeyPeek = document.getElementById('journey-peek');
          const journeyClose = document.getElementById('journey-close');
          if (journeyToggle) journeyToggle.addEventListener('click', function() { setJourneyOpen(!state.journeyOpen); });
          if (journeyPeek) journeyPeek.addEventListener('click', function() {
            setJourneyOpen(true);
            const closeButton = document.getElementById('journey-close');
            if (closeButton) closeButton.focus();
          });
          if (journeyClose) journeyClose.addEventListener('click', function() {
            setJourneyOpen(false);
            const peek = document.getElementById('journey-peek');
            if (peek) peek.focus();
          });
          mountJourneyPanel();
        }
        if (!student && tabs.some(function(tab) { return tab[0] === 'tickets'; }) && state.ticketBadgeFor !== state.actingAs) {
          const requested = state.actingAs;
          state.ticketBadgeFor = requested;
          callServer('getStaffTicketBadge', requested).then(function(badge) {
            if (state.actingAs !== requested) return;
            state.staffTicketUnread = badge.unreadCount || 0;
            paintTabDot('tickets', state.staffTicketUnread, 'Tickets');
          }).catch(function() { state.ticketBadgeFor = ''; });
        }
      }

      function tabLabel(tab) {
        if (tab[0] === 'help' && state.studentHome && state.studentHome.unreadTicketCount) return 'Help<span class="dot" aria-label="Unread reply"></span>';
        if (tab[0] === 'tickets' && state.staffTicketUnread) return 'Tickets<span class="dot" aria-label="Unread tickets"></span>';
        return tab[1];
      }

      function paintTabDot(view, count, label) {
        const button = document.querySelector('[data-view="' + view + '"]');
        if (!button) return;
        button.innerHTML = label + (count ? '<span class="dot" aria-label="Unread"></span>' : '');
      }

      function loadStudentHome() {
        if (state.studentHome) return Promise.resolve(state.studentHome);
        if (!state.studentHomeRequest) {
          state.studentHomeRequest = callServer('getStudentHome').then(function(home) {
            state.studentHome = home;
            return home;
          }).finally(function() {
            state.studentHomeRequest = null;
          });
        }
        return state.studentHomeRequest;
      }

      function setJourneyOpen(open) {
        state.journeyOpen = !!open;
        document.body.classList.toggle('journey-open', state.journeyOpen);
        const panel = document.getElementById('journey-panel');
        if (panel) panel.classList.toggle('open', state.journeyOpen);
        const toggle = document.getElementById('journey-toggle');
        const peek = document.getElementById('journey-peek');
        if (toggle) toggle.setAttribute('aria-expanded', state.journeyOpen ? 'true' : 'false');
        if (peek) peek.setAttribute('aria-expanded', state.journeyOpen ? 'true' : 'false');
        const drawer = document.getElementById('journey-drawer');
        if (drawer) {
          drawer.setAttribute('aria-hidden', state.journeyOpen ? 'false' : 'true');
          if (state.journeyOpen) drawer.removeAttribute('inert');
          else drawer.setAttribute('inert', '');
        }
      }

      function mountJourneyPanel() {
        const body = document.getElementById('journey-body');
        if (!body) return;
        if (!state.studentHome) body.innerHTML = '<p class="muted">Loading your journey...</p>';
        loadStudentHome().then(function(home) {
          paintStudentJourney(home);
        }).catch(function(error) {
          const target = document.getElementById('journey-body');
          if (target) target.innerHTML = '<p class="notice error">' + escapeHtml(error && error.message ? error.message : error) + '</p>';
        });
      }

      function renderStudentSection() {
        const main = document.getElementById('main');
        main.innerHTML = '<p class="muted">Loading your EE...</p>';
        loadStudentHome().then(function(home) {
          if (state.section === 'mywork') paintStudentWork(home);
          else paintStudentHome(home);
        }).catch(showError);
      }

      function renderStudentView() {
        setJourneyOpen(true);
      }

      function nextIncomplete(home) {
        const byTemplate = {};
        (home.actionItems || []).forEach(function(item) {
          if (item.CreatorType === 'System') byTemplate[item.TemplateId] = item;
        });
        for (let index = 0; index < home.templates.length; index++) {
          const template = home.templates[index];
          const item = byTemplate[template.milestoneId];
          if (!item || item.Status !== 'Completed') return { template: template, item: item || null };
        }
        return null;
      }

      function paintStudentHome(home) {
        const main = document.getElementById('main');
        const next = nextIncomplete(home);
        const returned = (home.actionItems || []).filter(function(item) { return item.returnedComment && item.Status !== 'Completed'; })[0];
        const meetings = home.templates.filter(function(template) { return template.type === 'meeting'; });
        const meetingDone = meetings.filter(function(template) {
          return (home.actionItems || []).some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
        }).length;
        const done = (home.actionItems || []).filter(function(item) { return item.CreatorType === 'System' && item.Status === 'Completed'; }).length;
        const currentPhase = next ? (home.phases.filter(function(phase) { return phase.phaseId === next.template.phase; })[0] || {}).phaseTitle : 'Complete';
        const hero = next ? `<section class="hero"><div><p class="eyebrow">Your next step</p><h2>${escapeHtml(next.template.title)}</h2><p>${escapeHtml(next.template.description || 'Complete this milestone before the due date.')}</p></div><div>${next.item && next.item.DueDate ? `<div class="chip">${escapeHtml(String(next.item.DueDate).slice(0, 10))}</div>` : ''}${formButton(home, next)}</div></section>` : '<section class="hero"><div><p class="eyebrow">All caught up</p><h2>No action needed right now</h2><p>Open Journey to see what is coming.</p></div></section>';
        main.innerHTML = `${hero}
          ${home.unreadTicketCount ? `<div class="notice">Reply received${home.unreadTicketTitle ? ': ' + escapeHtml(home.unreadTicketTitle) : ''}. <button type="button" class="link-button" id="open-help">Open Help</button></div>` : ''}
          ${returned ? `<div class="notice">Returned: ${escapeHtml(returned.Title)}. ${escapeHtml(returned.returnedComment)}</div>` : ''}
          <section class="strip"><h2>Your EE journey</h2><p class="muted">${escapeHtml(currentPhase || '')}${home.cohort ? ' · Cohort ' + escapeHtml(home.cohort) : ''}</p>
            <ol class="steps">${home.phases.map(function(phase) {
              const phaseItems = home.templates.filter(function(template) { return template.phase === phase.phaseId; });
              const phaseDone = phaseItems.every(function(template) {
                return (home.actionItems || []).some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
              });
              const current = next && next.template.phase === phase.phaseId;
              return `<li class="step ${phaseDone ? 'done' : ''} ${current ? 'current' : ''}">${escapeHtml(phase.phaseTitle)}</li>`;
            }).join('')}</ol></section>
          <div class="tiles">
            <div class="tile"><div class="muted">Milestones</div><div class="val">${done} <small>/ ${home.templates.length}</small></div></div>
            <div class="tile"><div class="muted">Sessions</div><div class="val">${meetingDone} <small>/ ${meetings.length}</small></div></div>
            <div class="tile"><div class="muted">Subject</div><div class="val" style="font-size:16px">${escapeHtml(home.subject || 'Not chosen')}</div></div>
            <div class="tile"><div class="muted">Anchor</div><div class="val" style="font-size:16px">${escapeHtml(home.anchor || '—')}</div></div>
          </div>`;
        bindFormButtons(main);
        const help = document.getElementById('open-help');
        if (help) help.addEventListener('click', function() { state.section = 'help'; renderShell(); });
        paintTabDot('help', home.unreadTicketCount, 'Help');
      }

      function formButton(home, next) {
        if (!next || !next.item || next.template.mOwner !== 'student') return next && next.template ? '<p>Waiting on ' + escapeHtml(next.template.mOwner) + '.</p>' : '';
        if (next.template.type === 'form') {
          if (home.publishedForms && home.publishedForms[next.template.milestoneId]) return `<button type="button" class="button" data-open-form="${escapeHtml(next.template.milestoneId)}">Open form</button>`;
          return '<p>Your coordinator has not published this form yet.</p>';
        }
        return '<button type="button" class="button secondary" data-go-journey>Open journey</button>';
      }

      function paintStudentJourney(home) {
        const main = document.getElementById('journey-body');
        if (!main) return;
        const phases = home.phases || [];
        const items = home.actionItems || [];
        const templates = home.templates || [];
        const phaseTitle = {};
        phases.forEach(function(phase) { phaseTitle[phase.phaseId] = phase.phaseTitle || phase.phaseId; });
        const current = nextIncomplete(home);
        const currentPhaseId = current && current.template ? current.template.phase : '';
        const systemItems = items.filter(function(item) { return item.CreatorType === 'System'; });
        const doneCount = systemItems.filter(function(item) { return item.Status === 'Completed'; }).length;
        const total = templates.length || systemItems.length;
        const zoom = state.journeyFilters.phaseId;
        const visiblePhases = zoom === 'all' ? phases : phases.filter(function(phase) { return phase.phaseId === zoom; });
        const composerPhase = zoom === 'all' ? (currentPhaseId || (phases[phases.length - 1] || {}).phaseId || '') : zoom;
        const percent = total ? Math.round((doneCount / total) * 100) : 0;
        main.innerHTML = `<section class="journey">
          <div class="journey-head"><div><p class="eyebrow">Extended Essay</p><h1>Your journey</h1></div><p class="journey-score"><strong>${doneCount}</strong> of ${total} done</p></div>
          <div class="journey-bar" role="img" aria-label="${doneCount} of ${total} milestones done"><span style="width:${percent}%"></span></div>
          <ol class="journey-path">${phases.map(function(phase) {
            const phaseTemplates = templates.filter(function(template) { return template.phase === phase.phaseId; });
            const phaseDone = phaseTemplates.filter(function(template) {
              return systemItems.some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
            }).length;
            const stateClass = phase.phaseId === currentPhaseId ? 'here' : (phaseTemplates.length && phaseDone === phaseTemplates.length ? 'done' : '');
            return `<li><button type="button" class="phase-stop ${stateClass}" data-zoom="${escapeHtml(phase.phaseId)}" aria-pressed="${zoom === phase.phaseId ? 'true' : 'false'}"><span class="phase-mark"></span><span class="phase-name">${escapeHtml(phase.phaseTitle || phase.phaseId)}</span><span class="phase-count">${phaseDone}/${phaseTemplates.length || 0}</span></button></li>`;
          }).join('')}</ol>
          <div class="journey-filters">
            <button type="button" data-zoom="all" aria-pressed="${zoom === 'all' ? 'true' : 'false'}">Whole journey</button>
            <button type="button" data-layer="milestones" aria-pressed="${state.journeyFilters.showSystem ? 'true' : 'false'}">Milestones</button>
            <button type="button" data-layer="todos" aria-pressed="${state.journeyFilters.showStudent ? 'true' : 'false'}">To-dos</button>
          </div>
          ${journeyHereCard(home, current, phaseTitle, zoom, currentPhaseId)}
          ${visiblePhases.length ? visiblePhases.map(function(phase) {
            return renderJourneyPhase(home, phase, phaseTitle, current, zoom, currentPhaseId, composerPhase);
          }).join('') : '<div class="empty">Official milestones appear after your cohort is assigned.</div>'}
        </section>`;
        bindJourney(main, home, currentPhaseId);
        bindFormButtons(main);
      }

      function journeyHereCard(home, current, phaseTitle, zoom, currentPhaseId) {
        if (!current || !current.template) return '<section class="here-card"><p class="eyebrow">All caught up</p><h2>The official milestones are complete</h2><p>Add a to-do if something still needs your attention.</p></section>';
        if (zoom !== 'all' && zoom !== currentPhaseId) return '';
        const item = current.item;
        const title = phaseTitle[current.template.phase] || current.template.phase;
        const due = item && item.DueDate ? shortDate(item.DueDate) : '';
        const actions = journeyActions(item, current.template, true);
        return `<section class="here-card" data-task-id="${item ? escapeHtml(item.TaskId) : ''}"><p class="eyebrow">You are here · ${escapeHtml(title)}</p><h2>${escapeHtml(current.template.title)}</h2><p>${escapeHtml(current.template.description || 'This is your next step.')}</p><div class="step-actions">${due ? `<span class="chip">${escapeHtml(due)}</span>` : ''}${actions || `<span class="chip">${escapeHtml(milestoneProgressLabel(item, current.template))}</span>`}</div></section>`;
      }

      function renderJourneyPhase(home, phase, phaseTitle, current, zoom, currentPhaseId, composerPhase) {
        const detailed = zoom !== 'all' || phase.phaseId === currentPhaseId;
        const milestones = (home.templates || []).filter(function(template) { return template.phase === phase.phaseId; });
        const todos = (home.actionItems || []).filter(function(item) {
          return item.CreatorType === 'Student' && (item.PhaseId === phase.phaseId || (!item.PhaseId && phase.phaseId === currentPhaseId));
        }).sort(function(left, right) {
          return (left.Status === 'Completed') - (right.Status === 'Completed') || textCompare(left.Title, right.Title);
        });
        const showMilestones = state.journeyFilters.showSystem;
        const showTodos = state.journeyFilters.showStudent;
        const rows = [];
        if (showMilestones) milestones.forEach(function(template) {
          const item = (home.actionItems || []).filter(function(entry) { return entry.CreatorType === 'System' && entry.TemplateId === template.milestoneId; })[0] || null;
          rows.push(renderJourneyMilestone(template, item, detailed, current, zoom));
        });
        if (showTodos) todos.forEach(function(item) { rows.push(renderJourneyTodo(item)); });
        const composer = showTodos && phase.phaseId === composerPhase ? `<form class="add-todo" data-phase="${escapeHtml(phase.phaseId)}"><input maxlength="240" placeholder="Add a to-do in ${escapeHtml(phase.phaseTitle || phase.phaseId)}" aria-label="New to-do"><button class="button" type="submit">Add</button></form>` : '';
        const done = milestones.filter(function(template) {
          return (home.actionItems || []).some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
        }).length;
        return `<section class="journey-phase ${phase.phaseId === currentPhaseId ? 'here' : ''}"><header><h2>${escapeHtml(phase.phaseTitle || phase.phaseId)}</h2><span class="muted">${done} of ${milestones.length}</span></header><ol class="steps-rail">${rows.join('') || '<li class="muted">Nothing in this view.</li>'}</ol>${composer}</section>`;
      }

      function renderJourneyMilestone(template, item, detailed, current, zoom) {
        const status = item ? item.Status : 'Pending';
        const isHere = current && current.template.milestoneId === template.milestoneId && status !== 'Completed';
        const showActions = item && item.canUpdate && zoom !== 'all';
        const due = item && item.DueDate ? shortDate(item.DueDate) : '';
        return `<li class="step ${status === 'Completed' ? 'done' : ''} ${isHere ? 'here' : ''}" data-task-id="${item ? escapeHtml(item.TaskId) : ''}" data-creator-type="System"><span class="rail"></span><div><div class="step-top"><h3>${escapeHtml(template.title)}</h3><span class="muted">${escapeHtml(milestoneKind(template))}${due ? ' · ' + escapeHtml(due) : ''}</span></div>${detailed ? `<p class="muted">${escapeHtml(template.description || '')}</p>` : ''}${item && item.returnedComment ? `<p class="notice">Returned: ${escapeHtml(item.returnedComment)}</p>` : ''}<div class="step-actions"><span class="muted">${escapeHtml(milestoneProgressLabel(item, template))}</span>${showActions ? journeyActions(item, template, false) : ''}</div></div></li>`;
      }

      function renderJourneyTodo(item) {
        const editing = state.editingTodo === item.TaskId;
        const due = item.DueDate ? String(item.DueDate).slice(0, 10) : '';
        return `<li class="step todo ${item.Status === 'Completed' ? 'done' : ''}" data-task-id="${escapeHtml(item.TaskId)}" data-creator-type="Student"><span class="rail"></span><div><div class="step-top"><h3>${escapeHtml(item.Title)}</h3><span class="muted">To-do${due ? ' · ' + escapeHtml(shortDate(due)) : ''}</span></div>${item.Description && !editing ? `<p class="muted">${escapeHtml(item.Description)}</p>` : ''}${editing ? `<div class="todo-edit"><input data-todo-title value="${escapeHtml(item.Title)}" maxlength="240" aria-label="To-do title"><textarea data-todo-description aria-label="To-do note">${escapeHtml(item.Description || '')}</textarea><input type="date" data-todo-date value="${escapeHtml(due)}" aria-label="To-do date"><div class="step-actions"><button type="button" class="button" data-save-todo="${escapeHtml(item.TaskId)}">Save</button><button type="button" class="button secondary" data-close-todo>Close</button></div></div>` : `<div class="step-actions"><button type="button" class="button ${item.Status === 'Completed' ? 'secondary' : ''}" data-set-status="${item.Status === 'Completed' ? 'Pending' : 'Completed'}">${item.Status === 'Completed' ? 'Not done yet' : 'Done'}</button><button type="button" class="link-button" data-edit-todo="${escapeHtml(item.TaskId)}">Edit</button></div>`}</div></li>`;
      }

      function journeyActions(item, template, prominent) {
        if (!item || !item.canUpdate || item.Status === 'Completed') return '';
        let html = '';
        if (template && template.type === 'form') html += formJourneyButton(template);
        if (template && template.type !== 'form' && item.Status === 'Pending') html += '<button type="button" class="button secondary" data-set-status="In Progress">Start</button>';
        if (!template || template.type !== 'form') html += `<button type="button" class="button${prominent ? '' : ''}" data-set-status="Completed">Done</button>`;
        return html;
      }

      function formJourneyButton(template) {
        if (state.studentHome && state.studentHome.publishedForms && state.studentHome.publishedForms[template.milestoneId]) return `<button type="button" class="button" data-open-form="${escapeHtml(template.milestoneId)}">Open form</button>`;
        return '<span class="muted">Form not published yet</span>';
      }

      function milestoneKind(template) {
        const names = { form: 'Form', upload: 'Upload', doc: 'Document', approval: 'Approval', meeting: 'Session' };
        return names[template.type] || 'Milestone';
      }

      function milestoneProgressLabel(item, template) {
        if (item && item.Status === 'Completed') return 'Done';
        if (item && item.canUpdate) return item.Status === 'In Progress' ? 'In progress' : 'Yours to do';
        if (template.type === 'meeting') return 'Your supervisor logs this session';
        if (template.mOwner === 'supervisor') return 'With your supervisor';
        if (template.mOwner === 'coordinator') return 'With the EE Coordinator';
        if (template.mOwner === 'lead') return 'With your subject lead';
        return 'Waiting';
      }

      function shortDate(value) {
        const text = String(value || '').slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return '';
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const parts = text.split('-');
        return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + parts[0];
      }

      function textCompare(left, right) {
        return String(left || '').localeCompare(String(right || ''));
      }

      function bindJourney(main, home, currentPhaseId) {
        main.querySelectorAll('[data-zoom]').forEach(function(button) {
          button.addEventListener('click', function() {
            const next = button.dataset.zoom;
            state.journeyFilters.phaseId = state.journeyFilters.phaseId === next && next !== 'all' ? 'all' : next;
            paintStudentJourney(home);
          });
        });
        main.querySelectorAll('[data-layer]').forEach(function(button) {
          button.addEventListener('click', function() {
            if (button.dataset.layer === 'milestones') state.journeyFilters.showSystem = !state.journeyFilters.showSystem;
            else state.journeyFilters.showStudent = !state.journeyFilters.showStudent;
            paintStudentJourney(home);
          });
        });
        main.querySelectorAll('[data-set-status]').forEach(function(button) {
          button.addEventListener('click', function() {
            const card = button.closest('[data-task-id]');
            const taskId = card && card.dataset.taskId;
            if (!taskId) return;
            button.disabled = true;
            runMutation('setActionItemStatus', [taskId, button.dataset.setStatus, '', home.cohort || ''], { key: 'action-item:' + taskId }).then(function() {
              patchJourneyItem(taskId, { Status: button.dataset.setStatus });
              paintStudentJourney(state.studentHome || home);
              showSuccess(button.dataset.setStatus === 'Completed' ? 'Marked done.' : 'Progress saved.');
            }).catch(function(error) { button.disabled = false; showError(error); });
          });
        });
        main.querySelectorAll('.add-todo').forEach(function(form) {
          form.addEventListener('submit', function(event) {
            event.preventDefault();
            const input = form.querySelector('input');
            const title = input.value.trim();
            if (!title) return;
            const phaseId = form.dataset.phase || currentPhaseId || '';
            form.querySelector('button').disabled = true;
            runMutation('addStudentTodo', [title, phaseId], { key: 'student-todo:new' }).then(function(result) {
              const created = { TaskId: result.TaskId, StudentId: state.user.email, CreatorType: 'Student', TemplateId: '', PhaseId: phaseId, Title: title, Description: '', DueDate: '', Status: 'Pending', canEdit: true, canUpdate: true };
              if (state.studentHome) state.studentHome.actionItems = (state.studentHome.actionItems || []).concat([created]);
              else home.actionItems = (home.actionItems || []).concat([created]);
              state.journeyFilters.showStudent = true;
              paintStudentJourney(state.studentHome || home);
              const fresh = document.querySelector('.add-todo input');
              if (fresh) fresh.focus();
              showSuccess('To-do added.');
            }).catch(function(error) { form.querySelector('button').disabled = false; showError(error, form); });
          });
        });
        main.querySelectorAll('[data-edit-todo]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.editingTodo = button.dataset.editTodo;
            paintStudentJourney(home);
          });
        });
        const closeTodo = main.querySelector('[data-close-todo]');
        if (closeTodo) closeTodo.addEventListener('click', function() { state.editingTodo = ''; paintStudentJourney(home); });
        main.querySelectorAll('[data-save-todo]').forEach(function(button) {
          button.addEventListener('click', function() {
            const card = button.closest('[data-task-id]');
            const title = card.querySelector('[data-todo-title]').value;
            const description = card.querySelector('[data-todo-description]').value;
            const date = card.querySelector('[data-todo-date]').value;
            button.disabled = true;
            runMutation('updateStudentTodo', [button.dataset.saveTodo, title, description], { key: 'action-item:' + button.dataset.saveTodo }).then(function() {
              return runMutation('setActionItemDueDate', [button.dataset.saveTodo, date], { key: 'action-item-date:' + button.dataset.saveTodo });
            }).then(function() {
              patchJourneyItem(button.dataset.saveTodo, { Title: title, Description: description, DueDate: date });
              state.editingTodo = '';
              paintStudentJourney(state.studentHome || home);
              showSuccess('To-do saved.');
            }).catch(function(error) { button.disabled = false; showError(error, card); });
          });
        });
      }

      function patchJourneyItem(taskId, changes) {
        if (!state.studentHome || !state.studentHome.actionItems) return;
        const item = state.studentHome.actionItems.filter(function(entry) { return entry.TaskId === taskId; })[0];
        if (!item) return;
        Object.keys(changes).forEach(function(key) { item[key] = changes[key]; });
      }

      function paintStudentWork(home) {

              <div class="muted">Latest: ${escapeHtml(student.latestTitle || '—')}</div></article>`;
          }).join('')}</div>` : '<div class="empty">No students in this view. Supervisors only see their own advisees. Coordinators see the cohort.</div>'}`;
        document.getElementById('staff-cohort').addEventListener('change', function(event) {

          renderShell();
        });
        document.getElementById('staff-search').addEventListener('input', function(event) {
          state.staffQuery = event.target.value;
          const query = state.staffQuery.trim().toLowerCase();
          main.querySelectorAll('[data-search]').forEach(function(card) {
            card.classList.toggle('hidden', query && card.dataset.search.indexOf(query) < 0);
          });
        });
        main.querySelectorAll('[data-open-student]').forEach(function(button) {
          button.addEventListener('click', function() {
            callServer('getStaffStudent', button.dataset.openStudent, state.cohortId).then(function(detail) {
              state.staffStudent = detail;
              paintStaffStudent(detail);
            }).catch(showError);
          });

      function paintStaffStudent(detail) {
        const main = document.getElementById('main');
        const student = detail.student;
        const phases = {};
        (detail.phases || []).forEach(function(phase) { phases[phase.phaseId] = phase.phaseTitle; });
        let html = `<button type="button" class="link-button back" id="staff-back">← My Students</button>
          <div class="page-head"><div><p class="eyebrow">${escapeHtml(student.subject || 'Extended Essay')}</p><h1>${escapeHtml(student.displayName)}</h1>
          <p class="muted">${escapeHtml(student.hrm || '')} ${student.studentNumber ? '· ' + escapeHtml(student.studentNumber) : ''}</p></div></div>`;
        if (detail.showDocs) {
          html += `<div class="doc-grid">${[['Folder', detail.links.folder], ['EE Doc', detail.links.doc], ['RPPF', detail.links.rppf], ['Poster', detail.links.poster]].map(function(link) {
            const url = safeUrl(link[1]);
            return `<article class="doc-card"><strong>${link[0]}</strong><div>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">Open</a>` : '<span class="muted">Not created yet</span>'}</div></article>`;
          }).join('')}</div>`;
        }
        let lastPhase = '';
        detail.milestones.forEach(function(milestone) {
          if (milestone.phase !== lastPhase) {
            if (lastPhase) html += '</section>';
            lastPhase = milestone.phase;
            html += `<section class="strip"><h2>${escapeHtml(phases[milestone.phase] || milestone.phase)}</h2>`;
          }
          html += `<div class="milestone-row"><div><strong>${escapeHtml(milestone.title)}</strong><div class="muted">${escapeHtml(milestone.type)} · ${escapeHtml(milestone.owner)} · ${escapeHtml(milestone.status)}${milestone.due ? ' · ' + escapeHtml(milestone.due) : ''}</div>${milestone.returnedComment ? `<div class="notice">${escapeHtml(milestone.returnedComment)}</div>` : ''}</div><div class="actions">`;
          if (milestone.canAct && milestone.type === 'approval') {
            html += `<button type="button" class="button" data-decide="approve" data-task="${escapeHtml(milestone.taskId)}">Approve</button><button type="button" class="button secondary" data-decide="return" data-task="${escapeHtml(milestone.taskId)}">Return</button>`;
          } else if (milestone.canAct && milestone.type === 'meeting') {
            html += `<button type="button" class="button" data-decide="session" data-task="${escapeHtml(milestone.taskId)}">Log session</button>`;
          } else if (milestone.type === 'form') {
            html += `<button type="button" class="button secondary" data-view-response="${escapeHtml(milestone.milestoneId)}">View form</button>`;
          }
          html += '</div></div>';
        });
        if (lastPhase) html += '</section>';
        main.innerHTML = html;
        document.getElementById('staff-back').addEventListener('click', function() { state.staffStudent = null; renderStaffHome(); });
        main.querySelectorAll('[data-decide]').forEach(function(button) {
          button.addEventListener('click', function() {
            const action = button.dataset.decide;
            const comment = action === 'approve' ? '' : window.prompt(action === 'return' ? 'Comments for the student' : 'Session summary');
            if (action !== 'approve' && !comment) return;
            button.disabled = true;
            runMutation('recordMilestoneDecision', [button.dataset.task, action, comment || '', student.email, state.cohortId], {
              key: 'milestone:' + button.dataset.task
            }).then(function() {
              state.staffHome = null;
              return callServer('getStaffStudent', student.email, state.cohortId);
            }).then(function(fresh) {
              state.staffStudent = fresh;
              paintStaffStudent(fresh);
              showSuccess(action === 'return' ? 'Returned to the student.' : 'Milestone updated.');
            }).catch(function(error) { button.disabled = false; showError(error); });
          });
        });
        main.querySelectorAll('[data-view-response]').forEach(function(button) {
          button.addEventListener('click', function() {
            callServer('getFormResponse', button.dataset.viewResponse, student.email).then(function(form) {
              const answers = form.response ? form.response.values : null;
              const body = (form.fields || []).map(function(field) {
                return `<p><strong>${escapeHtml(field.label)}</strong><br>${escapeHtml(answers ? answers[field.name] || '—' : 'No response yet')}</p>`;
              }).join('');
              openFormShell(form.title || 'Form', body, '', null);
            }).catch(showError);
          });
        });
      }

      function openStudentForm(milestoneId) {
        callServer('getStudentForm', milestoneId).then(function(form) { paintLiveForm(form); }).catch(showError);

      function paintLiveForm(form) {
        const values = form.response ? form.response.values : {};
        openFormShell(form.title, form.html, form.js, {
          fields: form.fields,
          values: values,
          student: form.student,
          onSubmit: function(collected, submit) {
            return runMutation('saveStudentForm', [form.milestoneId, {
              values: collected,
              lastUpdated: form.response ? form.response.lastUpdated : '',
              submit: submit
            }], { key: 'form:' + form.milestoneId }).then(function() {
              state.studentHome = null;
              closeForm();
              showSuccess(submit ? 'Form submitted.' : 'Draft saved.');
              renderStudentSection();
            });
          }
        });

      function openFormShell(title, html, js, binding) {
        const dialog = document.getElementById('form-dialog');
        dialog.hidden = false;
        dialog.innerHTML = `<div class="form-panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="toolbar"><h2>${escapeHtml(title)}</h2><button type="button" class="button secondary" id="close-form">Close</button></div><div id="ee-form-root">${html || ''}</div><p class="notice error" id="form-error" hidden></p><div class="toolbar"><button type="button" class="button secondary" id="save-form-draft">Save draft</button><button type="button" class="button" id="submit-form">Submit</button></div></div>`;
        document.getElementById('close-form').addEventListener('click', closeForm);
        const root = document.getElementById('ee-form-root');
        if (binding && binding.fields) fillFormControls(root, binding.fields, binding.values || {});
        if (js) {
          try { runFormScript(js, { root: root, fields: binding ? binding.fields : [], student: binding ? binding.student : {}, draft: binding ? binding.values : {} }); }
          catch (error) {
            const formError = document.getElementById('form-error');
            formError.hidden = false;
            formError.textContent = error.message || String(error);
          }
        }
        const submit = function(isSubmit) {
          if (!binding || !binding.onSubmit) { closeForm(); return; }
          const error = document.getElementById('form-error');
          error.hidden = true;
          binding.onSubmit(collectFormValues(root, binding.fields), isSubmit).catch(function(err) {
            error.hidden = false;
            error.textContent = err.message || String(err);
          });
        };
        if (!binding || !binding.onSubmit) {
          document.getElementById('save-form-draft').hidden = true;
          document.getElementById('submit-form').hidden = true;
        } else {
          document.getElementById('save-form-draft').addEventListener('click', function() { submit(false); });
          document.getElementById('submit-form').addEventListener('click', function() { submit(true); });
        }
      }

      function closeForm() {
        const dialog = document.getElementById('form-dialog');
        if (!dialog) return;
        dialog.hidden = true;
        dialog.innerHTML = '';
      }

      function fillFormControls(root, fields, values) {
        fields.forEach(function(field) {
          let input = root.querySelector('[name="' + field.name + '"]');
          if (!input) {
            const label = document.createElement('label');
            label.className = 'field';
            label.appendChild(document.createTextNode(field.label));
            input = field.type === 'textarea' ? document.createElement('textarea') : (field.type === 'select' ? document.createElement('select') : document.createElement('input'));
            if (field.type === 'checkbox') input.type = 'checkbox';
            input.name = field.name;
            label.appendChild(input);
            root.appendChild(label);
          }
          if (input.tagName === 'SELECT') {
            const current = values[field.name] || '';
            input.innerHTML = '<option value="">Select…</option>' + (field.options || []).map(function(option) {
              return `<option ${option === current ? 'selected' : ''}>${escapeHtml(option)}</option>`;
            }).join('');
          } else if (input.type === 'checkbox') input.checked = values[field.name] === 'Yes' || values[field.name] === true;
          else if (values[field.name]) input.value = values[field.name];
        });
      }

      function collectFormValues(root, fields) {
        const values = {};
        fields.forEach(function(field) {
          const input = root.querySelector('[name="' + field.name + '"]');
          if (!input) return;
          values[field.name] = input.type === 'checkbox' ? input.checked : input.value;
        });
        return values;
      }

      function runFormScript(js, api) {
        if (!js || !String(js).trim()) return;
        const runner = new Function('EEForm', 'google', 'window', 'parent', 'top', 'document', 'fetch', 'XMLHttpRequest', 'eval', 'Function', js);
        runner(api, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined);
      }

      function renderFaq(faq) {
        return `<article class="faq" data-faq="${escapeHtml((faq.question + ' ' + faq.answer).toLowerCase())}"><strong>${escapeHtml(faq.question)}</strong><p>${escapeHtml(faq.answer)}</p></article>`;

      function categoryChip(name, categories) {
        const match = (categories || []).filter(function(item) { return item.name === name; })[0];
        return `<span class="chip ${match ? match.chip : ''}">${escapeHtml(name)}</span>`;
      }

      function messageLabel(message, ticket) {
        if (state.user.role === 'student') {
          if (message.authorRole === 'student') return 'You';
          return ticket.route === 'coordinator' ? 'EE Coordinator' : 'Supervisor';
        }
        if (message.authorEmail === state.user.email) return 'You';
        if (message.authorRole === 'student') return ticket.displayName || 'Student';
        return 'Staff';
      }

      function renderTicket(ticket, staff) {
        const mine = function(message) {
          return state.user.role === 'student' ? message.authorRole === 'student' : message.authorEmail === state.user.email;
        };
        const unread = staff ? ticket.staffUnread : ticket.studentUnread;
        return `<details class="ticket" data-ticket="${escapeHtml(ticket.ticketId)}" data-updated="${escapeHtml(ticket.lastUpdated || '')}">
          <summary>${categoryChip(ticket.category, (state.ticketHub && state.ticketHub.categories) || [])}<strong>${escapeHtml(ticket.title)}</strong><span class="chip">${escapeHtml(ticket.status)}</span><span class="muted">${escapeHtml(ticket.routeLabel || '')}</span>${staff ? `<span class="muted">${escapeHtml(ticket.displayName || '')}</span>` : ''}${unread ? '<span class="dot" aria-label="Unread"></span>' : ''}</summary>
          <div class="body"><div class="thread">${(ticket.messages || []).map(function(message) {
            return `<article class="msg ${mine(message) ? 'mine' : 'staff'}"><strong>${escapeHtml(messageLabel(message, ticket))}</strong> <span class="muted">${escapeHtml(String(message.createdAt || '').replace('T', ' ').slice(0, 16))}</span><p>${escapeHtml(message.body)}</p></article>`;
          }).join('')}</div>
          ${staff ? `<label class="field">Status<select data-ticket-status>${['Open', 'In Progress', 'Resolved', 'Closed'].map(function(status) {
            return `<option ${ticket.status === status ? 'selected' : ''}>${status}</option>`;
          }).join('')}</select></label>` : ''}
          <label class="field">Reply<textarea data-ticket-reply maxlength="2000" placeholder="Write a reply"></textarea></label>
          <div><button type="button" class="button" data-send-ticket="${escapeHtml(ticket.ticketId)}">Send</button></div></div></details>`;
      }

      function bindTicketList(main, tickets, staff) {
        const byId = {};
        tickets.forEach(function(ticket) { byId[ticket.ticketId] = ticket; });
        main.querySelectorAll('details.ticket').forEach(function(details) {
          details.addEventListener('toggle', function() {
            const ticket = byId[details.dataset.ticket];
            if (!details.open || !ticket) return;
            const unread = staff ? ticket.staffUnread : ticket.studentUnread;
            if (!unread) return;
            callServer('markTicketRead', ticket.ticketId, details.dataset.updated, staff ? state.actingAs : '').then(function(result) {
              details.dataset.updated = result.lastUpdated || details.dataset.updated;
              if (staff) {
                ticket.staffUnread = false;
                state.staffTicketUnread = Math.max(0, (state.staffTicketUnread || 0) - 1);
                paintTabDot('tickets', state.staffTicketUnread, 'Tickets');
              } else {
                ticket.studentUnread = false;
                if (state.studentHome) state.studentHome.unreadTicketCount = Math.max(0, (state.studentHome.unreadTicketCount || 0) - 1);
                paintTabDot('help', state.studentHome ? state.studentHome.unreadTicketCount : 0, 'Help');
              }
              const dot = details.querySelector('summary .dot');
              if (dot) dot.remove();
            }).catch(function(error) {
              showError(error);
              if (staff) renderStaffTickets();
              else renderStudentHelp();
            });
          });
        });
        main.querySelectorAll('[data-send-ticket]').forEach(function(button) {
          button.addEventListener('click', function() {
            const ticket = byId[button.dataset.sendTicket];
            const details = button.closest('details');
            const body = details.querySelector('[data-ticket-reply]').value.trim();
            const statusSelect = details.querySelector('[data-ticket-status]');
            const status = statusSelect ? statusSelect.value : ticket.status;
            const statusChanged = !!(statusSelect && status !== ticket.status);
            if (!body && !statusChanged) return;
            button.disabled = true;
            const token = details.dataset.updated || ticket.lastUpdated;
            const viewAs = staff ? state.actingAs : '';
            const reply = body ? callServer('replyTicket', ticket.ticketId, body, token, viewAs) : Promise.resolve({ lastUpdated: token, status: ticket.status });
            reply.then(function(result) {
              if (!statusChanged) return result;
              return callServer('setTicketStatus', ticket.ticketId, status, result.lastUpdated, viewAs);
            }).then(function() {
              showSuccess(body ? 'Reply sent.' : 'Status updated.');
              if (staff) renderStaffTickets();
              else {
                state.studentHome = null;
                renderStudentHelp();
              }
            }).catch(function(error) {
              button.disabled = false;
              showError(error);
            });
          });
        });
      }

      function openTicketDialog(categories) {
        const dialog = document.getElementById('form-dialog');
        let selected = categories[0] || null;
        dialog.hidden = false;
        dialog.innerHTML = `<div class="form-panel" role="dialog" aria-modal="true" aria-label="New question"><div class="toolbar"><h2>New question</h2><button type="button" class="button secondary" id="close-ticket">Close</button></div>

          <p class="notice" id="ticket-route">${selected ? escapeHtml(routeNote(selected.route)) : ''}</p>

              }).join('') || '<p class="muted">No templates in this phase.</p>'}</div></section>`;
            }).join('')}</div>` : '<div class="empty">Add phases before arranging templates.</div>'}`;
          document.getElementById('manage-phases').addEventListener('click', function() { switchAdminSection('phases'); });
