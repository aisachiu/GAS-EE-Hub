<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #004C80;
        --muted: #536273;
        --paper: #FFFFFF;
        --surface: #ffffff;
        --line: #E9ECEF;
        --green: #20C997;
        --green-soft: #E8F8F3;
        --coral: #88002B;
        --gold: #FF5A36;
        --shadow: 0 4px 14px rgba(0, 76, 128, .08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: #263746; font: 14px/1.4 Helvetica, "Heiti TC", Arial, sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px clamp(12px, 2.5vw, 32px); background: var(--ink); color: white; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink); background: white; font: 700 11px Helvetica, Arial, sans-serif; }
      .account { color: #e8f0f5; text-align: right; font-size: 11px; line-height: 1.25; }
      .request-indicator { display: inline-flex; align-items: center; gap: 6px; min-height: 16px; color: #e8f0f5; font-size: 10px; opacity: 0; transition: opacity .18s ease; }
      .request-indicator.active { opacity: 1; }
      .request-indicator::before { width: 8px; height: 8px; border: 2px solid rgba(232, 240, 245, .35); border-top-color: var(--green); border-radius: 50%; content: ''; animation: request-spin .8s linear infinite; }
      @keyframes request-spin { to { transform: rotate(360deg); } }
      .shell { max-width: 1440px; margin: 0 auto; padding: 10px clamp(12px, 2.5vw, 32px) 32px; }
      .nav { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .nav button, .subnav button { border: 0; border-radius: 3px; padding: 6px 10px; color: var(--muted); background: transparent; font-size: 13px; }
      .nav button[aria-current="page"], .subnav button[aria-current="page"] { color: var(--green); background: var(--green-soft); font-weight: 700; }
      main { padding-top: 14px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font: 600 28px/1.15 Helvetica, "Heiti TC", Arial, sans-serif; letter-spacing: 0; }
      h2 { font-size: 18px; line-height: 1.2; }
      h3 { font-size: 15px; margin-bottom: 3px; }
      .eyebrow { color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .lede, .muted { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .list { display: grid; gap: 7px; max-width: 860px; }
      .list-row, .resource-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .list-row button { color: inherit; text-align: left; border: 0; background: none; padding: 0; }
      .list-row strong { display: block; font-size: 16px; }
      .list-row small { color: var(--muted); }
      .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
      .resource { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
      .resource p { white-space: pre-wrap; color: var(--muted); }
      .resource a { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
      .subnav { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 14px; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
      .toolbar select, .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 7px 9px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 3px; }
      .toolbar select { width: auto; min-width: 170px; }
      .button { min-height: 32px; padding: 6px 10px; border: 1px solid var(--gold); border-radius: 3px; color: white; background: var(--gold); font-weight: 700; }
      .button.secondary { border-color: var(--ink); color: var(--ink); background: white; }
      .button.danger { border-color: var(--coral); color: white; background: var(--coral); }
      .button:disabled { opacity: .55; cursor: wait; }
      .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { max-width: 300px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      th { position: sticky; top: 0; color: var(--muted); background: var(--line); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .actions { display: flex; gap: 8px; white-space: nowrap; }
      .link-button { border: 0; padding: 4px; color: var(--green); background: transparent; font-weight: 700; }
      .link-button:disabled { color: #84918c; cursor: not-allowed; }
      .editor { margin-top: 14px; padding: 14px; background: #f8fafb; border-top: 3px solid var(--green); }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .field { min-width: 0; display: grid; gap: 5px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
      .field.wide { grid-column: 1 / -1; }
      .field textarea { min-height: 76px; resize: vertical; }
      .field.check { align-content: start; }
      .field.check input { width: 18px; height: 18px; accent-color: var(--green); }
      .notice { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--gold); background: #fff5f1; color: #663020; }
      .error { border-left-color: var(--coral); background: #fff0ec; color: #7c2b1b; }
      .empty { padding: 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }
      .status { min-height: 24px; color: var(--coral); }
      .back { margin-bottom: 22px; }
      .student-greeting { padding: 16px 18px; background: var(--surface); border-top: 3px solid var(--gold); box-shadow: var(--shadow); }
      .student-greeting h1 { max-width: 840px; }
      .journey-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
      .journey-controls { padding: 12px; background: #f8fafb; border-top: 3px solid var(--green); }
      .journey-controls.collapsed { display: none; }
      .quick-todo { display: flex; gap: 5px; margin: 8px 0 14px; }
      .quick-todo input { min-width: 0; width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 3px; }
      .filter-group { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
      .filter-group label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .filter-group input { accent-color: var(--green); }
      .timeline { display: grid; gap: 8px; min-width: 0; }
      .task-card { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .task-card.system-task { border-left-color: var(--coral); }
      .task-card.student-task { border-left-color: var(--gold); }
      .task-card.completed { opacity: .72; }
      .task-card[draggable="true"] { cursor: grab; }
      .task-card.dragging { opacity: .4; }
      .task-card input[type="checkbox"] { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .task-card h3 { margin: 0 0 5px; }
      .task-card p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .task-card select, .task-card input[type="date"] { padding: 4px 6px; border: 1px solid var(--line); color: var(--ink); background: white; font-size: 12px; }
      .task-meta { display: grid; justify-items: end; gap: 7px; color: var(--muted); font-size: 12px; }
      .task-kind { color: var(--coral); font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .task-card.student-task .task-kind { color: var(--gold); }
      .todo-editor { display: grid; gap: 7px; margin-top: 9px; }
      .todo-editor input, .todo-editor textarea { width: 100%; padding: 6px; border: 1px solid var(--line); }
      .timeline-toolbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
      .timeline-toolbar select { padding: 6px 8px; border: 1px solid var(--line); background: white; }
      .drop-hint { display: none; color: var(--green); font-size: 11px; }
      .task-card.drag-over .drop-hint { display: block; }
      .template-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; align-items: start; }
      .template-phase { min-width: 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .template-phase header p { margin-bottom: 9px; }
      .template-phase.drag-over { border-color: var(--coral); background: #fff8f5; }
      .template-list { display: grid; gap: 5px; }
      .template-card { display: grid; gap: 4px; min-width: 0; padding: 8px 10px; background: #f8fafb; border: 1px solid var(--line); cursor: grab; overflow-wrap: anywhere; font-size: 13px; }
      .sync-pending { border-color: var(--coral) !important; box-shadow: 0 0 0 2px rgba(189, 83, 62, .2); }
      .sync-confirmed { animation: sync-confirmed .85s ease both; }
      .sync-rejected { animation: sync-rejected .85s ease both; }
      @keyframes sync-confirmed { 0%, 100% { box-shadow: 0 0 0 0 rgba(20, 116, 95, 0); } 35% { box-shadow: 0 0 0 4px rgba(20, 116, 95, .45); } }
      @keyframes sync-rejected { 0%, 100% { box-shadow: 0 0 0 0 rgba(189, 83, 62, 0); } 35% { box-shadow: 0 0 0 4px rgba(189, 83, 62, .5); } }
      .template-card small { color: var(--muted); }
      .template-card:active { cursor: grabbing; }
      #assignment-roster input[type="date"] { min-width: 140px; padding: 7px; border: 1px solid var(--line); background: white; }
      #assignment-roster td:first-child { width: 56px; }
      #assignment-roster input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); }
      .pathway { display: grid; gap: 12px; max-width: 980px; margin-top: 18px; }
      .pathway-phase { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); }
      .pathway-phase.locked { border-top-color: var(--line); }
      .phase-heading { display: flex; justify-content: space-between; gap: 14px; padding: 13px 15px 9px; }
      .phase-heading h2 { margin-bottom: 3px; font: 600 18px/1.2 Helvetica, "Heiti TC", Arial, sans-serif; }
      .phase-status { flex: none; align-self: start; padding: 4px 9px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 700; }
      .locked .phase-status { color: var(--muted); background: var(--line); }
      .phase-description { margin: 0 15px 9px; color: var(--muted); }
      .milestone-list { margin: 0; padding: 0; list-style: none; }
      .milestone-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 10px 15px; border-top: 1px solid var(--line); }
      .milestone-item input { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .milestone-item h3 { margin: 0 0 4px; }
      .milestone-item p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .milestone-meta { color: var(--muted); font-size: 12px; text-align: right; }
      .milestone-type { color: var(--coral); font-size: 11px; font-weight: 750; text-transform: uppercase; }
      .section-gap { margin-top: 38px; }
      .hidden { display: none !important; }
      .staff-pill { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.16); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .tabs { display: flex; gap: 2px; align-self: stretch; min-width: 0; overflow-x: auto; }
      .tabs button { border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: #d5e4ef; background: transparent; font-weight: 700; white-space: nowrap; }
      .tabs button[aria-current="page"] { color: white; border-bottom-color: var(--gold); }
      .topbar { min-height: 40px; padding: 0 12px; }
      main { max-width: 1180px; margin: 0 auto; padding: 10px; }
      .hero { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; color: white; background: var(--ink); border-left: 5px solid var(--gold); }
      .hero p { margin: 0; color: #d5e4ef; }
      .hero h2 { margin: 2px 0 4px; color: white; }
      .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
      .tile, .scard, .strip, .doc-card { padding: 10px 12px; background: white; border: 1px solid var(--line); }
      .tile .val { font-size: 20px; font-weight: 700; color: var(--ink); }
      .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; margin: 8px 0 0; padding: 0; }
      .step { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }
      .step.current { color: var(--ink); }
      .step.done { color: var(--green); }
      .segs { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
      .segs i { display: block; height: 7px; border-radius: 2px; background: var(--line); }
      .segs i.d { background: var(--ink); } .segs i.p { background: var(--gold); } .segs i.l { background: var(--coral); }
      .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
      .scard button.name { border: 0; padding: 0; background: none; color: var(--ink); font-weight: 700; font-size: 16px; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; background: #eef3f6; color: #3d4d5c; font-size: 12px; font-weight: 700; }
      .chip.bad { background: #fde8ea; color: var(--coral); }
      .chip.ok { background: var(--green-soft); color: #0d7a5f; }
      .form-dialog { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 12px; background: rgba(0, 30, 50, .45); }
      .form-dialog[hidden] { display: none; }
      .form-panel { width: min(720px, 100%); max-height: calc(100vh - 24px); overflow: auto; padding: 14px; background: white; border-top: 4px solid var(--gold); }
      .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .milestone-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      @media (max-width: 800px) { .tiles, .steps, .doc-grid { grid-template-columns: 1fr 1fr; } .topbar { flex-wrap: wrap; } }
      @media (max-width: 700px) {
        .topbar { align-items: flex-start; padding: 14px 16px; }
        .shell { padding: 16px 14px 36px; }
        .nav { overflow-x: auto; }
        .nav button { white-space: nowrap; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .form-grid { grid-template-columns: 1fr; }
        .field.wide { grid-column: auto; }
        .list-row { align-items: flex-start; }
        .account { max-width: 48%; overflow-wrap: anywhere; }
        h1 { font-size: 25px; }
        .template-phase { padding: 14px; }
        #assignment-roster td, #assignment-roster th { padding: 9px 8px; }
        #assignment-roster input[type="date"] { min-width: 128px; }
        .phase-heading { padding: 16px; }
        .phase-description { margin-inline: 16px; }
        .milestone-item { padding: 13px 16px; grid-template-columns: 24px minmax(0, 1fr); }
        .milestone-meta { grid-column: 2; text-align: left; }
        .journey-layout { grid-template-columns: 1fr; }
        .task-card { grid-template-columns: 24px minmax(0, 1fr); padding: 14px; }
        .task-meta { grid-column: 2; justify-items: start; grid-template-columns: repeat(2, max-content); align-items: center; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="shell"><p class="muted">Connecting to VSA EE Hub...</p></div></div>
    <script>
      const state = {
        user: null,
        view: 'home',
        cohortId: '',
        selectedStudent: null,
        adminEntity: 'cohorts',
        adminData: null,
        editingRecord: null,
        originalKey: '',
        status: '',
        selectedMemberIds: [],
        assignmentStudentIds: [],
        importRecords: null,
        journeyFilters: { phaseId: 'all', showSystem: true, showStudent: true },
        journeyControlsOpen: true,
        section: '',
        actingAs: '',
        studentHome: null,
        staffHome: null,
        staffStudent: null,
        staffQuery: '',
        requests: { active: 0, nextId: 0 },
        mutationQueues: {}
      };

      document.addEventListener('DOMContentLoaded', start);

      function start() {
        callServer('getAppBootstrap').then(function(result) {
          if (!result || !result.user) {
            showFatal('Access unavailable', 'Your signed-in account is not registered in the EE workbook.');
            return;
          }
          state.user = result.user;
          state.view = state.user.role === 'student' ? 'home' : 'students';
          state.section = state.view;
          if (state.user.permissions && state.user.permissions.canAdmin) state.actingAs = 'coordinator';
          else if (state.user.permissions && state.user.permissions.isSupervisor) state.actingAs = 'supervisor';
          else state.actingAs = 'staff';
          renderShell();
        }).catch(function(error) {
          showFatal('Unable to start', error.message || 'The application could not reach the EE workbook.');
        });
      }

      function callServer(method) {
        const args = Array.prototype.slice.call(arguments, 1);
        beginRequest(method);
        return new Promise(function(resolve, reject) {
          if (!window.google || !google.script || !google.script.run) {
            endRequest(method);
            reject(new Error('Open this app from its Google Apps Script deployment.'));
            return;
          }
          const runner = google.script.run.withSuccessHandler(function(result) {
            endRequest(method);
            resolve(result);
          }).withFailureHandler(function(error) {
            endRequest(method);
            reject(new Error(error && error.message ? error.message : String(error)));
          });
          runner[method].apply(runner, args);
        });
      }

      function runMutation(method, args, options) {
        const config = options || {};
        const queueKey = config.key || method;
        const prior = state.mutationQueues[queueKey] || Promise.resolve();
        const operation = prior.catch(function() {}).then(function() {
          const operationId = ++state.requests.nextId;
          if (config.start) config.start(operationId);
          return callServer.apply(null, [method].concat(args || [])).then(function(result) {
            if (config.confirm) config.confirm(result, operationId);
            return result;
          }).catch(function(error) {
            if (config.reject) {
              config.reject(error, operationId);
              return { rejected: true, error: error };
            }
            throw error;
          });
        });
        state.mutationQueues[queueKey] = operation.catch(function() {});
        return operation;
      }

      function beginRequest(label) {
        state.requests.active += 1;
        const indicator = document.getElementById('request-indicator');
        if (indicator) {
          indicator.textContent = label ? 'Saving ' + humanizeRequestLabel(label) + '...' : 'Working...';
          indicator.classList.add('active');
          indicator.setAttribute('aria-busy', 'true');
        }
      }

      function endRequest() {
        state.requests.active = Math.max(0, state.requests.active - 1);
        const indicator = document.getElementById('request-indicator');
        if (indicator && state.requests.active === 0) {
          indicator.textContent = '';
          indicator.classList.remove('active');
          indicator.setAttribute('aria-busy', 'false');
        }
      }

      function humanizeRequestLabel(label) {
        return String(label).replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
      }

      function markSync(element, status) {
        if (!element) return;
        element.classList.remove('sync-pending', 'sync-confirmed', 'sync-rejected');
        if (status === 'pending') {
          element.classList.add('sync-pending');
          element.setAttribute('aria-busy', 'true');
          return;
        }
        element.setAttribute('aria-busy', 'false');
        if (status === 'confirmed' || status === 'rejected') {
          element.classList.add('sync-' + status);
          window.setTimeout(function() { element.classList.remove('sync-' + status); }, 900);
        }
      }

      function renderShell() {
        const student = state.user.role === 'student';
        const tabs = student
          ? [['home', 'Home'], ['journey', 'Journey'], ['mywork', 'My Work'], ['resources', 'Resources']]
          : [['students', 'My Students'], ['resources', 'Resources']];
        if (state.user.permissions && state.user.permissions.canAdmin) tabs.push(['admin', 'Admin']);
        if (!tabs.some(function(tab) { return tab[0] === state.section; })) state.section = tabs[0][0];
        state.view = state.section;
        document.getElementById('app').innerHTML = `
          <header class="topbar">
            <div class="brand"><span class="brand-mark">EE</span><span>EE Hub</span>${student ? '' : '<span class="staff-pill">Staff</span>'}</div>
            <nav class="tabs" aria-label="Sections">${tabs.map(function(tab) {
              return `<button type="button" data-view="${tab[0]}" aria-current="${state.section === tab[0] ? 'page' : 'false'}">${tab[1]}</button>`;
            }).join('')}</nav>
            <div class="account"><span id="request-indicator" class="request-indicator" aria-live="polite" aria-busy="false"></span><div>${escapeHtml(state.user.displayName)}</div></div>
          </header>
          <div id="feedback-region" aria-live="polite"></div>
          <main id="main"></main>
          <div id="form-dialog" class="form-dialog" hidden></div>`;
        document.querySelectorAll('[data-view]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.section = button.dataset.view;
            state.view = state.section;
            state.selectedStudent = null;
            state.staffStudent = null;
            state.status = '';
            renderShell();
          });
        });
        if (state.section === 'admin') renderAdmin();
        else if (state.section === 'resources') renderResources();
        else if (student) renderStudentSection();
        else renderStaffHome();
      }

      function renderStudentSection() {
        const main = document.getElementById('main');
        main.innerHTML = '<p class="muted">Loading your EE...</p>';
        const request = state.studentHome ? Promise.resolve(state.studentHome) : callServer('getStudentHome');
        request.then(function(home) {
          state.studentHome = home;
          if (state.section === 'journey') paintStudentJourney(home);
          else if (state.section === 'mywork') paintStudentWork(home);
          else paintStudentHome(home);
        }).catch(showError);
      }

      function renderStudentView() {
        state.section = 'journey';
        renderStudentSection();
      }

      function nextIncomplete(home) {
        const byTemplate = {};
        (home.actionItems || []).forEach(function(item) {
          if (item.CreatorType === 'System') byTemplate[item.TemplateId] = item;
        });
        for (let index = 0; index < home.templates.length; index++) {
          const template = home.templates[index];
          const item = byTemplate[template.milestoneId];
          if (!item || item.Status !== 'Completed') return { template: template, item: item || null };
        }
        return null;
      }

      function paintStudentHome(home) {
        const main = document.getElementById('main');
        const next = nextIncomplete(home);
        const returned = (home.actionItems || []).filter(function(item) { return item.returnedComment && item.Status !== 'Completed'; })[0];
        const meetings = home.templates.filter(function(template) { return template.type === 'meeting'; });
        const meetingDone = meetings.filter(function(template) {
          return (home.actionItems || []).some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
        }).length;
        const done = (home.actionItems || []).filter(function(item) { return item.CreatorType === 'System' && item.Status === 'Completed'; }).length;
        const currentPhase = next ? (home.phases.filter(function(phase) { return phase.phaseId === next.template.phase; })[0] || {}).phaseTitle : 'Complete';
        const hero = next ? `<section class="hero"><div><p class="eyebrow">Your next step</p><h2>${escapeHtml(next.template.title)}</h2><p>${escapeHtml(next.template.description || 'Complete this milestone before the due date.')}</p></div><div>${next.item && next.item.DueDate ? `<div class="chip">${escapeHtml(String(next.item.DueDate).slice(0, 10))}</div>` : ''}${formButton(home, next)}</div></section>` : '<section class="hero"><div><p class="eyebrow">All caught up</p><h2>No action needed right now</h2><p>Check Journey for what is coming.</p></div></section>';
        main.innerHTML = `${hero}
          ${returned ? `<div class="notice">Returned: ${escapeHtml(returned.Title)}. ${escapeHtml(returned.returnedComment)}</div>` : ''}
          <section class="strip"><h2>Your EE journey</h2><p class="muted">${escapeHtml(currentPhase || '')}${home.cohort ? ' · Cohort ' + escapeHtml(home.cohort) : ''}</p>
            <ol class="steps">${home.phases.map(function(phase) {
              const phaseItems = home.templates.filter(function(template) { return template.phase === phase.phaseId; });
              const phaseDone = phaseItems.every(function(template) {
                return (home.actionItems || []).some(function(item) { return item.TemplateId === template.milestoneId && item.Status === 'Completed'; });
              });
              const current = next && next.template.phase === phase.phaseId;
              return `<li class="step ${phaseDone ? 'done' : ''} ${current ? 'current' : ''}">${escapeHtml(phase.phaseTitle)}</li>`;
            }).join('')}</ol></section>
          <div class="tiles">
            <div class="tile"><div class="muted">Milestones</div><div class="val">${done} <small>/ ${home.templates.length}</small></div></div>
            <div class="tile"><div class="muted">Sessions</div><div class="val">${meetingDone} <small>/ ${meetings.length}</small></div></div>
            <div class="tile"><div class="muted">Subject</div><div class="val" style="font-size:16px">${escapeHtml(home.subject || 'Not chosen')}</div></div>
            <div class="tile"><div class="muted">Anchor</div><div class="val" style="font-size:16px">${escapeHtml(home.anchor || '—')}</div></div>
          </div>`;
        bindFormButtons(main);
      }

      function formButton(home, next) {
        if (!next || !next.item || next.template.mOwner !== 'student') return next && next.template ? '<p>Waiting on ' + escapeHtml(next.template.mOwner) + '.</p>' : '';
        if (next.template.type === 'form') {
          if (home.publishedForms && home.publishedForms[next.template.milestoneId]) return `<button type="button" class="button" data-open-form="${escapeHtml(next.template.milestoneId)}">Open form</button>`;
          return '<p>Your coordinator has not published this form yet.</p>';
        }
        return '<button type="button" class="button secondary" data-go-journey>Open journey</button>';
      }

      function paintStudentJourney(home) {
        const main = document.getElementById('main');
        main.innerHTML = renderActionTimeline(home.actionItems || []);
        bindActionTimeline(main, '', home.cohort || '');
        bindFormButtons(main);
      }

      function paintStudentWork(home) {
        const links = [
          ['Drive folder', home.links.folder],
          ['Extended Essay', home.links.doc],
          ['RPPF', home.links.rppf],
          ['Poster', home.links.poster]
        ];
        document.getElementById('main').innerHTML = `<h2>My documents</h2><div class="doc-grid">${links.map(function(link) {
          const url = safeUrl(link[1]);
          return `<article class="doc-card"><h3>${escapeHtml(link[0])}</h3><p class="muted">${url ? 'Shared with your supervisor.' : 'Not created yet.'}</p>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open</a>` : ''}</article>`;
        }).join('')}</div>`;
      }

      function bindFormButtons(main) {
        main.querySelectorAll('[data-open-form]').forEach(function(button) {
          button.addEventListener('click', function() { openStudentForm(button.dataset.openForm); });
        });
        const journey = main.querySelector('[data-go-journey]');
        if (journey) journey.addEventListener('click', function() { state.section = 'journey'; renderShell(); });
      }

      function renderActionTimeline(items) {
        const phases = Array.from(new Set(items.map(function(item) { return item.PhaseId; }).filter(Boolean))).sort();
        const isOwnStudentView = state.user.role === 'student' && !state.selectedStudent;
        return `<div class="timeline-toolbar"><button type="button" class="button secondary" id="toggle-journey-controls">${state.journeyControlsOpen ? 'Hide controls' : 'Show controls'}</button><span class="muted">${items.length} action items</span></div>
          <div class="journey-layout">
            <aside class="journey-controls ${state.journeyControlsOpen ? '' : 'collapsed'}" id="journey-controls">
              ${isOwnStudentView ? '<form class="quick-todo" id="quick-todo"><input id="quick-todo-title" maxlength="240" placeholder="Add a new To-Do..." aria-label="New To-Do"><button class="button" type="submit" title="Add To-Do">+</button></form>' : ''}
              <div class="filter-group"><strong>Phase</strong><label><input type="radio" name="phase-filter" value="all" ${state.journeyFilters.phaseId === 'all' ? 'checked' : ''}> All phases</label>${phases.map(function(phaseId) {
                return `<label><input type="radio" name="phase-filter" value="${escapeHtml(phaseId)}" ${state.journeyFilters.phaseId === phaseId ? 'checked' : ''}> ${escapeHtml(phaseId)}</label>`;
              }).join('')}</div>
              <div class="filter-group"><strong>Tasks</strong><label><input type="checkbox" data-creator-filter="System" ${state.journeyFilters.showSystem ? 'checked' : ''}> Official milestones</label><label><input type="checkbox" data-creator-filter="Student" ${state.journeyFilters.showStudent ? 'checked' : ''}> My To-Dos</label></div>
            </aside>
            <section class="timeline" id="action-timeline" aria-label="Extended Essay timeline">${items.length ? items.map(renderActionItem).join('') : '<div class="empty">No action items yet. Official milestones appear after your cohort is assigned.</div>'}</section>
          </div>`;
      }

      function renderActionItem(item) {
        const systemTask = item.CreatorType === 'System';
        const dateValue = item.DueDate ? String(item.DueDate).slice(0, 10) : '';
        return `<article class="task-card ${systemTask ? 'system-task' : 'student-task'} ${item.Status === 'Completed' ? 'completed' : ''}" data-task-id="${escapeHtml(item.TaskId)}" data-phase-id="${escapeHtml(item.PhaseId || '')}" data-creator-type="${escapeHtml(item.CreatorType)}" draggable="${item.canEdit ? 'true' : 'false'}">
          <div><select data-task-status="${escapeHtml(item.TaskId)}" data-current-status="${escapeHtml(item.Status)}" aria-label="Task status" ${item.canUpdate ? '' : 'disabled'}>${['Pending', 'In Progress', 'Completed'].map(function(status) {
            return `<option value="${status}" ${item.Status === status ? 'selected' : ''}>${status}</option>`;
          }).join('')}</select></div>
          <div class="task-content"><span class="task-kind">${systemTask ? 'Official milestone' : 'My To-Do'}</span>
            ${item.canEdit ? `<div class="todo-editor"><input data-todo-title="${escapeHtml(item.TaskId)}" value="${escapeHtml(item.Title)}" maxlength="240" aria-label="To-Do title"><textarea data-todo-description="${escapeHtml(item.TaskId)}" aria-label="To-Do description">${escapeHtml(item.Description || '')}</textarea><button type="button" class="link-button" data-save-todo="${escapeHtml(item.TaskId)}">Save</button></div>` : `<h3>${escapeHtml(item.Title)}</h3><p>${escapeHtml(item.Description || '')}</p>${item.templateType === 'form' && state.studentHome && state.studentHome.publishedForms && state.studentHome.publishedForms[item.TemplateId] ? `<button type="button" class="button" data-open-form="${escapeHtml(item.TemplateId)}">Open form</button>` : ''}${item.returnedComment ? `<p class="notice">Returned: ${escapeHtml(item.returnedComment)}</p>` : ''}`}
            ${item.canEdit ? '<span class="drop-hint">Drop to place this To-Do beside this date</span>' : ''}
          </div>
          <div class="task-meta"><strong>${escapeHtml(item.PhaseId || 'To-Do')}</strong>${dateValue ? `<time datetime="${escapeHtml(dateValue)}">${escapeHtml(dateValue)}</time>` : '<span>No due date</span>'}${item.canEdit ? `<input type="date" data-task-date="${escapeHtml(item.TaskId)}" data-current-date="${escapeHtml(dateValue)}" value="${escapeHtml(dateValue)}" aria-label="To-Do due date">` : ''}</div>
        </article>`;
      }

      function bindActionTimeline(main, email, cohort) {
        const toggle = document.getElementById('toggle-journey-controls');
        toggle.addEventListener('click', function() {
          state.journeyControlsOpen = !state.journeyControlsOpen;
          renderStudentSection();
        });
        const quickTodo = document.getElementById('quick-todo');
        if (quickTodo) quickTodo.addEventListener('submit', function(event) {
          event.preventDefault();
          const input = document.getElementById('quick-todo-title');
          const button = quickTodo.querySelector('button');
          const title = input.value.trim();
          if (!title) return;
          button.disabled = true;
          runMutation('addStudentTodo', [title], { key: 'student-todo:new' }).then(function(result) {
            const timeline = document.getElementById('action-timeline');
            const item = { TaskId: result.TaskId, StudentId: state.user.email, CreatorType: 'Student', TemplateId: '', PhaseId: '', Title: title, Description: '', DueDate: '', Status: 'Pending', canEdit: true, canUpdate: true };
            if (timeline) {
              timeline.insertAdjacentHTML('beforeend', renderActionItem(item));
              const card = timeline.querySelector('[data-task-id="' + cssEscape(result.TaskId) + '"]');
              bindNewTodoCard(card, email, cohort);
              markSync(card, 'confirmed');
            }
            input.value = '';
            button.disabled = false;
            showSuccess('To-Do saved.');
          }).catch(function(error) {
            button.disabled = false;
            showError(error, quickTodo);
          });
        });
        main.querySelectorAll('[name="phase-filter"]').forEach(function(input) {
          input.addEventListener('change', function() { state.journeyFilters.phaseId = input.value; applyJourneyFilters(); });
        });
        main.querySelectorAll('[data-creator-filter]').forEach(function(input) {
          input.addEventListener('change', function() {
            if (input.dataset.creatorFilter === 'System') state.journeyFilters.showSystem = input.checked;
            else state.journeyFilters.showStudent = input.checked;
            applyJourneyFilters();
          });
        });
        main.querySelectorAll('[data-task-status]').forEach(function(input) {
          input.addEventListener('change', function() {
            const card = input.closest('[data-task-id]');
            const previousStatus = input.dataset.currentStatus;
            const nextStatus = input.value;
            markSync(card, 'pending');
            runMutation('setActionItemStatus', [input.dataset.taskStatus, nextStatus, email, cohort], {
              key: 'action-item:' + input.dataset.taskStatus,
              confirm: function() {
                input.dataset.currentStatus = nextStatus;
                card.classList.toggle('completed', nextStatus === 'Completed');
                markSync(card, 'confirmed');
              },
              reject: function(error) {
                input.value = previousStatus;
                markSync(card, 'rejected');
                showError(error, card);
              }
            });
          });
        });
        main.querySelectorAll('[data-task-date]').forEach(function(input) {
          input.addEventListener('change', function() {
            const card = input.closest('[data-task-id]');
            const previousDate = input.dataset.currentDate;
            const nextDate = input.value;
            const time = card.querySelector('time');
            markSync(card, 'pending');
            runMutation('setActionItemDueDate', [input.dataset.taskDate, nextDate], {
              key: 'action-item:' + input.dataset.taskDate,
              confirm: function() {
                input.dataset.currentDate = nextDate;
                if (time) { time.dateTime = nextDate; time.textContent = nextDate; }
                markSync(card, 'confirmed');
              },
              reject: function(error) {
                input.value = previousDate;
                markSync(card, 'rejected');
                showError(error, card);
              }
            });
          });
        });
        main.querySelectorAll('[data-save-todo]').forEach(function(button) {
          button.addEventListener('click', function() {
            const card = button.closest('[data-task-id]');
            const titleInput = card.querySelector('[data-todo-title]');
            const descriptionInput = card.querySelector('[data-todo-description]');
            const title = titleInput.value;
            const description = descriptionInput.value;
            markSync(card, 'pending');
            runMutation('updateStudentTodo', [button.dataset.saveTodo, title, description], {
              key: 'action-item:' + button.dataset.saveTodo,
              confirm: function() { markSync(card, 'confirmed'); },
              reject: function(error) {
                markSync(card, 'rejected');
                showError(error, card);
              }
            });
          });
        });
        main.querySelectorAll('[data-task-id][draggable="true"]').forEach(function(card) {
          card.addEventListener('dragstart', function(event) { event.dataTransfer.setData('text/plain', card.dataset.taskId); card.classList.add('dragging'); });
          card.addEventListener('dragend', function() { card.classList.remove('dragging'); main.querySelectorAll('.drag-over').forEach(function(item) { item.classList.remove('drag-over'); }); });
        });
        main.querySelectorAll('[data-task-id]').forEach(function(card) {
          card.addEventListener('dragover', function(event) { event.preventDefault(); card.classList.add('drag-over'); });
          card.addEventListener('dragleave', function() { card.classList.remove('drag-over'); });
          card.addEventListener('drop', function(event) {
            event.preventDefault();
            card.classList.remove('drag-over');
            const taskId = event.dataTransfer.getData('text/plain');
            if (!taskId || taskId === card.dataset.taskId) return;
            const position = event.clientY < card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2 ? 'before' : 'after';
            const movingCard = main.querySelector('[data-task-id="' + cssEscape(taskId) + '"]');
            if (!movingCard || !movingCard.matches('.student-task')) return;
            const previousParent = movingCard.parentElement;
            const previousNextSibling = movingCard.nextElementSibling;
            if (position === 'before') card.parentElement.insertBefore(movingCard, card);
            else card.parentElement.insertBefore(movingCard, card.nextElementSibling);
            markSync(movingCard, 'pending');
            runMutation('repositionStudentTodo', [taskId, card.dataset.taskId, position], {
              key: 'action-order',
              confirm: function() { markSync(movingCard, 'confirmed'); },
              reject: function(error) {
                if (previousNextSibling && previousNextSibling.parentElement === previousParent) previousParent.insertBefore(movingCard, previousNextSibling);
                else previousParent.appendChild(movingCard);
                markSync(movingCard, 'rejected');
                showError(error, movingCard);
              }
            });
          });
        });
        applyJourneyFilters();
      }

      function bindNewTodoCard(card, email, cohort) {
        if (!card) return;
        const status = card.querySelector('[data-task-status]');
        if (status) status.addEventListener('change', function() {
          const nextStatus = status.value;
          markSync(card, 'pending');
          runMutation('setActionItemStatus', [status.dataset.taskStatus, nextStatus, email, cohort], { key: 'action-item:' + status.dataset.taskStatus,
            confirm: function() { status.dataset.currentStatus = nextStatus; card.classList.toggle('completed', nextStatus === 'Completed'); markSync(card, 'confirmed'); },
            reject: function(error) { status.value = status.dataset.currentStatus; markSync(card, 'rejected'); showError(error, card); }
          });
        });
        const date = card.querySelector('[data-task-date]');
        if (date) date.addEventListener('change', function() {
          const nextDate = date.value;
          markSync(card, 'pending');
          runMutation('setActionItemDueDate', [date.dataset.taskDate, nextDate], { key: 'action-item:' + date.dataset.taskDate,
            confirm: function() { date.dataset.currentDate = nextDate; markSync(card, 'confirmed'); },
            reject: function(error) { date.value = date.dataset.currentDate; markSync(card, 'rejected'); showError(error, card); }
          });
        });
        const save = card.querySelector('[data-save-todo]');
        if (save) save.addEventListener('click', function() {
          const title = card.querySelector('[data-todo-title]').value;
          const description = card.querySelector('[data-todo-description]').value;
          markSync(card, 'pending');
          runMutation('updateStudentTodo', [save.dataset.saveTodo, title, description], { key: 'action-item:' + save.dataset.saveTodo,
            confirm: function() { markSync(card, 'confirmed'); },
            reject: function(error) { markSync(card, 'rejected'); showError(error, card); }
          });
        });
      }

      function applyJourneyFilters() {
        document.querySelectorAll('#action-timeline [data-task-id]').forEach(function(card) {
          const creatorVisible = card.dataset.creatorType === 'System' ? state.journeyFilters.showSystem : state.journeyFilters.showStudent;
          const phaseVisible = state.journeyFilters.phaseId === 'all' || card.dataset.phaseId === state.journeyFilters.phaseId;
          card.classList.toggle('hidden', !creatorVisible || !phaseVisible);
        });
      }

      function renderStaffHome() {
        const main = document.getElementById('main');
        if (state.staffStudent) { paintStaffStudent(state.staffStudent); return; }
        main.innerHTML = '<p class="muted">Loading students...</p>';
        callServer('getStaffHome', state.cohortId || '', state.actingAs).then(function(home) {
          state.staffHome = home;
          state.cohortId = home.cohortId || '';
          paintStaffCards(home);
        }).catch(showError);
      }

      function paintStaffCards(home) {
        const main = document.getElementById('main');
        const roles = [];
        if (state.user.permissions.canAdmin) roles.push(['coordinator', 'Coordinator']);
        if (state.user.permissions.isSupervisor) roles.push(['supervisor', 'Supervisor']);
        roles.push(['staff', 'Staff browse']);
        const students = home.students || [];
        const phaseName = {};
        (home.phases || []).forEach(function(phase) { phaseName[phase.phaseId] = phase.phaseTitle; });
        main.innerHTML = `<div class="toolbar">
            <label for="staff-cohort">Cohort</label><select id="staff-cohort">${(home.cohorts || []).map(function(cohort) {
              return `<option value="${escapeHtml(cohort.id)}" ${cohort.id === home.cohortId ? 'selected' : ''}>${escapeHtml(cohort.name)}</option>`;
            }).join('')}</select>
            <label for="acting-as">Acting as</label><select id="acting-as">${roles.map(function(role) {
              return `<option value="${role[0]}" ${state.actingAs === role[0] ? 'selected' : ''}>${role[1]}</option>`;
            }).join('')}</select>
            <input id="staff-search" type="search" placeholder="Search students" value="${escapeHtml(state.staffQuery)}" aria-label="Search students">
            <span class="muted">${students.length} students</span>
          </div>
          ${students.length ? `<div class="sgrid">${students.map(function(student) {
              return `<article class="scard" data-search="${escapeHtml((student.displayName + ' ' + student.subject + ' ' + student.hrm).toLowerCase())}"><button type="button" class="name" data-open-student="${escapeHtml(student.email)}">${escapeHtml(student.displayName)}</button>
              <div class="muted">${escapeHtml(student.subject || 'No subject yet')}${student.hrm ? ' · ' + escapeHtml(student.hrm) : ''}</div>
              <div class="segs" aria-label="${student.done} of ${student.total} milestones">${student.segments.split('').map(function(segment) { return `<i class="${segment === 'o' ? '' : segment}"></i>`; }).join('')}</div>
              <div class="chips"><span class="chip">${escapeHtml(phaseName[student.phaseId] || student.phaseId || 'Phase')}</span><span class="chip ${student.behind ? 'bad' : 'ok'}">${student.behind ? student.behind + ' overdue' : 'On track'}</span>${student.waiting.length ? `<span class="chip bad">${student.waiting.length} waiting</span>` : ''}${student.returned ? `<span class="chip bad">Returned</span>` : ''}</div>
              <div class="muted">Latest: ${escapeHtml(student.latestTitle || '—')}</div></article>`;
          }).join('')}</div>` : '<div class="empty">No students in this view. Supervisors only see their own advisees. Coordinators see the cohort.</div>'}`;
        document.getElementById('staff-cohort').addEventListener('change', function(event) {
          state.cohortId = event.target.value;
          state.staffHome = null;
          renderStaffHome();
        });
        document.getElementById('acting-as').addEventListener('change', function(event) {
          state.actingAs = event.target.value;
          state.staffHome = null;
          renderStaffHome();
        });
        document.getElementById('staff-search').addEventListener('input', function(event) {
          state.staffQuery = event.target.value;
          const query = state.staffQuery.trim().toLowerCase();
          main.querySelectorAll('[data-search]').forEach(function(card) {
            card.classList.toggle('hidden', query && card.dataset.search.indexOf(query) < 0);
          });
        });
        main.querySelectorAll('[data-open-student]').forEach(function(button) {
          button.addEventListener('click', function() {
            callServer('getStaffStudent', button.dataset.openStudent, state.cohortId).then(function(detail) {
              state.staffStudent = detail;
              paintStaffStudent(detail);
            }).catch(showError);
          });
        });
      }

      function paintStaffStudent(detail) {
        const main = document.getElementById('main');
        const student = detail.student;
        const phases = {};
        (detail.phases || []).forEach(function(phase) { phases[phase.phaseId] = phase.phaseTitle; });
        let html = `<button type="button" class="link-button back" id="staff-back">← My Students</button>
          <div class="page-head"><div><p class="eyebrow">${escapeHtml(student.subject || 'Extended Essay')}</p><h1>${escapeHtml(student.displayName)}</h1>
          <p class="muted">${escapeHtml(student.hrm || '')} ${student.studentNumber ? '· ' + escapeHtml(student.studentNumber) : ''}</p></div></div>`;
        if (detail.showDocs) {
          html += `<div class="doc-grid">${[['Folder', detail.links.folder], ['EE Doc', detail.links.doc], ['RPPF', detail.links.rppf], ['Poster', detail.links.poster]].map(function(link) {
            const url = safeUrl(link[1]);
            return `<article class="doc-card"><strong>${link[0]}</strong><div>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">Open</a>` : '<span class="muted">Not created yet</span>'}</div></article>`;
          }).join('')}</div>`;
        }
        let lastPhase = '';
        detail.milestones.forEach(function(milestone) {
          if (milestone.phase !== lastPhase) {
            if (lastPhase) html += '</section>';
            lastPhase = milestone.phase;
            html += `<section class="strip"><h2>${escapeHtml(phases[milestone.phase] || milestone.phase)}</h2>`;
          }
          html += `<div class="milestone-row"><div><strong>${escapeHtml(milestone.title)}</strong><div class="muted">${escapeHtml(milestone.type)} · ${escapeHtml(milestone.owner)} · ${escapeHtml(milestone.status)}${milestone.due ? ' · ' + escapeHtml(milestone.due) : ''}</div>${milestone.returnedComment ? `<div class="notice">${escapeHtml(milestone.returnedComment)}</div>` : ''}</div><div class="actions">`;
          if (milestone.canAct && milestone.type === 'approval') {
            html += `<button type="button" class="button" data-decide="approve" data-task="${escapeHtml(milestone.taskId)}">Approve</button><button type="button" class="button secondary" data-decide="return" data-task="${escapeHtml(milestone.taskId)}">Return</button>`;
          } else if (milestone.canAct && milestone.type === 'meeting') {
            html += `<button type="button" class="button" data-decide="session" data-task="${escapeHtml(milestone.taskId)}">Log session</button>`;
          } else if (milestone.type === 'form') {
            html += `<button type="button" class="button secondary" data-view-response="${escapeHtml(milestone.milestoneId)}">View form</button>`;
          }
          html += '</div></div>';
        });
        if (lastPhase) html += '</section>';
        main.innerHTML = html;
        document.getElementById('staff-back').addEventListener('click', function() { state.staffStudent = null; renderStaffHome(); });
        main.querySelectorAll('[data-decide]').forEach(function(button) {
          button.addEventListener('click', function() {
            const action = button.dataset.decide;
            const comment = action === 'approve' ? '' : window.prompt(action === 'return' ? 'Comments for the student' : 'Session summary');
            if (action !== 'approve' && !comment) return;
            button.disabled = true;

      function openFormShell(title, html, js, binding) {
        const dialog = document.getElementById('form-dialog');
        dialog.hidden = false;
        dialog.innerHTML = `<div class="form-panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="toolbar"><h2>${escapeHtml(title)}</h2><button type="button" class="button secondary" id="close-form">Close</button></div><div id="ee-form-root">${html || ''}</div><p class="notice error" id="form-error" hidden></p><div class="toolbar"><button type="button" class="button secondary" id="save-form-draft">Save draft</button><button type="button" class="button" id="submit-form">Submit</button></div></div>`;
        document.getElementById('close-form').addEventListener('click', closeForm);
        const root = document.getElementById('ee-form-root');
        if (binding && binding.fields) fillFormControls(root, binding.fields, binding.values || {});
        if (js) {
          try { runFormScript(js, { root: root, fields: binding ? binding.fields : [], student: binding ? binding.student : {}, draft: binding ? binding.values : {} }); }
          catch (error) {
            const formError = document.getElementById('form-error');
            formError.hidden = false;
            formError.textContent = error.message || String(error);
          }
        }
        const submit = function(isSubmit) {
          if (!binding || !binding.onSubmit) { closeForm(); return; }
          const error = document.getElementById('form-error');
          error.hidden = true;
          binding.onSubmit(collectFormValues(root, binding.fields), isSubmit).catch(function(err) {
            error.hidden = false;
            error.textContent = err.message || String(err);
          });
        };
        if (!binding || !binding.onSubmit) {
          document.getElementById('save-form-draft').hidden = true;
          document.getElementById('submit-form').hidden = true;
        } else {
          document.getElementById('save-form-draft').addEventListener('click', function() { submit(false); });
          document.getElementById('submit-form').addEventListener('click', function() { submit(true); });
        }
      }

      function closeForm() {
        const dialog = document.getElementById('form-dialog');
        if (!dialog) return;
        dialog.hidden = true;
        dialog.innerHTML = '';
      }

      function fillFormControls(root, fields, values) {
        fields.forEach(function(field) {
          let input = root.querySelector('[name="' + field.name + '"]');
          if (!input) {
            const label = document.createElement('label');
            label.className = 'field';
            label.appendChild(document.createTextNode(field.label));
            input = field.type === 'textarea' ? document.createElement('textarea') : (field.type === 'select' ? document.createElement('select') : document.createElement('input'));
            if (field.type === 'checkbox') input.type = 'checkbox';
            input.name = field.name;
            label.appendChild(input);
            root.appendChild(label);
          }
          if (input.tagName === 'SELECT') {
            const current = values[field.name] || '';
            input.innerHTML = '<option value="">Select…</option>' + (field.options || []).map(function(option) {
              return `<option ${option === current ? 'selected' : ''}>${escapeHtml(option)}</option>`;
            }).join('');
          } else if (input.type === 'checkbox') input.checked = values[field.name] === 'Yes' || values[field.name] === true;
          else if (values[field.name]) input.value = values[field.name];
        });
      }

      function collectFormValues(root, fields) {
        const values = {};
        fields.forEach(function(field) {
          const input = root.querySelector('[name="' + field.name + '"]');
          if (!input) return;
          values[field.name] = input.type === 'checkbox' ? input.checked : input.value;
        });
        return values;
      }

      function bindTemplateDragging(target) {
        target.querySelectorAll('[data-template-drag]').forEach(function(card) {
          card.addEventListener('dragstart', function(event) {
            event.dataTransfer.setData('text/plain', card.dataset.templateDrag);
            event.dataTransfer.effectAllowed = 'move';
          });
        });
        target.querySelectorAll('[data-phase-drop]').forEach(function(phase) {
          phase.addEventListener('dragover', function(event) { event.preventDefault(); phase.classList.add('drag-over'); });
          phase.addEventListener('dragleave', function(event) { if (!phase.contains(event.relatedTarget)) phase.classList.remove('drag-over'); });
          phase.addEventListener('drop', function(event) {
            event.preventDefault();
            phase.classList.remove('drag-over');
            const templateId = event.dataTransfer.getData('text/plain');
            const card = Array.from(target.querySelectorAll('[data-template-drag]')).find(function(item) { return item.dataset.templateDrag === templateId; });
            const targetCard = event.target.closest('[data-template-drag]');
            if (!card || (targetCard && targetCard === card)) return;
            const previousParent = card.parentElement;
            const previousPhaseId = card.closest('[data-phase-drop]') && card.closest('[data-phase-drop]').dataset.phaseDrop;
            const previousNextSibling = card.nextElementSibling;
            const beforeTemplateId = targetCard && targetCard.dataset.templateDrag !== templateId ? targetCard.dataset.templateDrag : '';
            const insertionPoint = beforeTemplateId ? Array.from(target.querySelectorAll('[data-template-drag]')).find(function(item) { return item.dataset.templateDrag === beforeTemplateId; }) : null;
            if (insertionPoint) insertionPoint.parentElement.insertBefore(card, insertionPoint);
            else phase.querySelector('.template-list').appendChild(card);
            card.dataset.templatePhase = phase.dataset.phaseDrop;
            markSync(card, 'pending');
            runMutation('reorderMilestoneTemplate', [templateId, phase.dataset.phaseDrop, beforeTemplateId], {
              key: 'template-order',
              confirm: function(result) {
                const authoritative = (result.order || []).filter(function(item) { return item.templateId === templateId; })[0];
                if (!authoritative || authoritative.phaseId !== phase.dataset.phaseDrop) {
                  rollbackTemplateCard(card, previousParent, previousNextSibling, previousPhaseId);
                  markSync(card, 'rejected');
                  showError(new Error('The template order changed before this save was confirmed.'));
                  return;
                }
                markSync(card, 'confirmed');
              },
              reject: function(error) {
                rollbackTemplateCard(card, previousParent, previousNextSibling, previousPhaseId);
                markSync(card, 'rejected');
                showError(error);
              }
            });
          });
        });
      }

      function rollbackTemplateCard(card, previousParent, previousNextSibling, previousPhaseId) {
        if (!card || !previousParent) return;
        if (previousNextSibling && previousNextSibling.parentElement === previousParent) previousParent.insertBefore(card, previousNextSibling);
        else previousParent.appendChild(card);
        card.dataset.templatePhase = previousPhaseId || card.dataset.templatePhase;
      }

          target.querySelectorAll('[data-assignment-student]').forEach(function(input) {
